:root{

}

  :root{ --bg:#0d0e14; --card:#171826; --card-b:#262838; --text:#eef0f7; --muted:#9aa0b4;
    --accent: hsl(var(--hue) 85% 62%); --accent2: hsl(calc(var(--hue) + 40) 90% 65%); }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn','Tahoma',sans-serif;

.glow{position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0;pointer-events:none}
.g1{width:260px;height:260px;background:var(--glow);top:-80px;right:-60px}
.g2{width:220px;height:220px;background:var(--accent2);bottom:10%;left:-70px;opacity:.25}
header{position:sticky;top:0;z-index:5;padding:16px 18px calc(14px + env(safe-area-inset-top,0px));

main{position:relative;z-index:1;padding:14px 14px 40px;max-width:540px;margin:0 auto}
.item{margin-bottom:12px;border-radius:18px;overflow:hidden;background:var(--card);
  border:1px solid var(--card-b);box-shadow:0 4px 18px -10px rgba(0,0,0,.25);transition:box-shadow .25s}
.item.open{box-shadow:0 8px 28px -8px hsl(var(--hue) 70% 40% / .35)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;
  cursor:pointer;user-select:none}

  font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.hd .t{flex:1;font-size:14.5px;font-weight:700}
.hd .chev{color:var(--accent);font-size:12px;transition:transform .25s ease}

footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:11px;padding:6px 0 26px}

header .meta{font-size:11px;opacity:.85;margin-top:4px}

.theme{background:var(--card);border:1px solid var(--card-b);border-radius:50%;width:39px;height:39px;color:var(--accent);font-size:20px;cursor:pointer}
footer{border-top:1px solid var(--card-b);padding-top:20px;margin-top:25px}
footer p{margin:5px 0}footer .brand{font-size:17px;margin:10px 0}footer strong{font-size:11px;color:var(--text)}

.ld-box{position:relative;width:170px;text-align:center}

.ld-bg,.ld-fg{fill:none;stroke-width:12}

.inner figure.fr{padding:8px}

.inner figure .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0;z-index:1}
.inner figure .frame img.x{display:none}
.frame .ph{position:relative;z-index:0;text-align:center;font-size:12px;font-weight:800;color:var(--accent);padding:0 14px;line-height:1.9}
.frame .ph i{display:block;font-style:normal;font-size:26px;opacity:.55}
.ap.off{opacity:.45;pointer-events:none}
.inner pre{direction:ltr;text-align:left;overflow-x:auto;background:var(--bg);border:1px solid var(--card-b);border-radius:10px;padding:10px;font-size:12px;line-height:1.7;margin:8px 0}
.inner details{margin:6px 0;border:1px solid var(--card-b);border-radius:10px;padding:8px 12px;background:var(--bg)}
.inner summary{cursor:pointer;font-weight:700;font-size:13px}
.inner details p{margin:8px 0 0;color:var(--muted)}

.inner .dlg{margin:10px 0;padding:10px 14px;border-radius:14px;background:var(--bg);border:1px dashed var(--card-b)}
.inner .dlg p{margin:0 0 6px;line-height:1.95}
.inner .dlg p:last-child{margin-bottom:0}
.inner .dlg b{color:var(--accent);margin-left:4px}
.inner .an{margin:10px 0;padding:10px 14px;border-radius:12px;border-inline-start:4px solid var(--accent);background:var(--bg)}
.inner .mx{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700}
.inner .lk{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px dotted var(--accent)}
</style>

<script>(function(){var C=376.99,p=0,done=false,fg=document.getElementById("ldFg"),nm=document.getElementById("ldNum");
var FA="۰۱۲۳۴۵۶۷۸۹";function fa(n){return String(n).replace(/[0-9]/g,function(d){return FA[d];});}
function set(v){p=v;fg.style.strokeDashoffset=(C-C*v/100).toFixed(1);nm.textContent=fa(Math.round(v))+"٪";}
set(4);var t=setInterval(function(){if(p<90)set(p+Math.max(.3,(90-p)/40));},50);
function fin(){if(done)return;done=true;clearInterval(t);set(100);var L=document.getElementById("loader");L.classList.add("done");setTimeout(function(){L.remove();},450);}
window.addEventListener("load",function(){setTimeout(fin,150)});setTimeout(fin,12000);})();</script>

<script>
const SECTIONS = [{"h":"تندخوانی واقعاً یعنی چه؟","b":"<p>تندخوانی فقط تند حرکت‌دادن چشم روی خط نیست. اگر چشم سریع از صفحه بگذرد اما نتوانی بگویی متن درباره‌ی چه بوده، عملاً سرعت بالا رفته ولی خواندن موفق نبوده است. خواندن مؤثر یعنی بتوانی سرعت، دقت و عمق فهم را با هدف خودت تنظیم کنی. برای پیدا کردن یک تاریخ در کتاب، لازم نیست هر جمله را با دقت یک متن ادبی بخوانی؛ اما برای فهم یک اثبات ریاضی یا تحلیل یک شعر، آهسته‌تر خواندن و برگشتن به جمله‌های دشوار کاملاً منطقی است.</p><p>پس هدف ثابت و یکسانی برای همه‌ی متن‌ها وجود ندارد. تندخوانیِ خوب بیشتر شبیه رانندگی با سرعت متناسب با جاده است: مسیر صاف و آشنا را می‌توان سریع‌تر طی کرد، اما در پیچ و مه باید آهسته شد. هیچ تکنیکی نباید تو را مجبور کند متن دشوار را با سرعتی بخوانی که فهمت آسیب ببیند.</p><p>در این درس سه چیز را با هم تمرین می‌کنی: کم‌کردن توقف‌های بی‌دلیل، دیدن گروه‌های واژه به جای تک‌تک واژه‌ها و بررسی فهم بعد از خواندن. این‌ها ابزارند؛ بسته به متن می‌توانی هر کدام را تغییر بدهی.</p><p class=\"tech\"><span class=\"tnum\">تمرین آغازین</span> خط پایه‌ی خودت را پیدا کن</p><ol><li>یک متن آشنا با طول معلوم، حدود ۳۰۰ تا ۵۰۰ واژه، انتخاب کن.</li><li>با زمان‌سنج بخوان و زمان را ثبت کن؛ برای خواندن متن لازم نیست عجله‌ی غیرعادی داشته باشی.</li><li>کتاب را ببند و در سه جمله پیام اصلی و دو نکته را بنویس.</li><li>فهم را از پنج نمره بده: پیام اصلی، جزئیات مهم و رابطه‌ی علت یا نتیجه.</li></ol><p>این اندازه‌گیری را ذخیره کن تا در پایان تمرین‌ها مقایسه‌ی واقعی داشته باشی. اگر سرعت بالا رفت اما فهم پایین آمد، آن تغییر پیشرفت محسوب نمی‌شود.</p><p class=\"tech\"><span class=\"tnum\">سرعت را درست تعریف کنیم</span></p><p>سرعت خواندن معمولاً با تعداد واژه در دقیقه سنجیده می‌شود، اما این عدد به‌تنهایی کیفیت را نشان نمی‌دهد. دو نفر ممکن است یک متن را در زمان یکسان بخوانند، ولی یکی بتواند رابطه‌ی علت و نتیجه را توضیح بدهد و دیگری فقط چند واژه‌ی آشنا را به خاطر بیاورد. برای همین، هنگام تمرین سه شاخص را کنار هم ثبت کن: زمان، میزان فهم و خستگی. اگر زمان کمتر شد، اما نتوانستی پیام متن را با زبان خودت بیان کنی، باید سرعت را پایین بیاوری یا روش خواندن را تغییر بدهی. هدف ما رکورد زدن در یک تست نیست؛ می‌خواهیم در وقت معمول مطالعه، اطلاعات را بهتر پیدا کنیم و واقعاً یاد بگیریم.</p><p class=\"tech\"><span class=\"tnum\">هدف خواندن را پیش از شروع روشن کن</span></p><p>قبل از اینکه کتاب را باز کنی، مشخص کن قرار است با متن چه کار کنی. چهار هدف رایج را از هم جدا کن: پیدا کردن یک داده‌ی مشخص، شناخت کلی موضوع، یادگرفتن مطلب تازه، و بررسی انتقادی یک ادعا. برای پیدا کردن تاریخ یا تعریف، لازم نیست از ابتدا تا انتها همه‌ی جمله‌ها را با یک دقت بخوانی؛ می‌توانی ابتدا تیتر و واژه‌های مربوط را پیدا کنی و بعد همان قسمت را دقیق بخوانی. برای یادگیری، باید رابطه‌ی ایده‌ها و دلیل مثال‌ها را دنبال کنی. برای بررسی انتقادی هم علاوه بر پیام نویسنده، باید ببینی چه شاهدی آورده و چه چیزی را نگفته است. یک جمله کنار عنوان بنویس: «بعد از این مطالعه می‌خواهم بتوانم…». اگر در پایان نتوانستی همان هدف را انجام بدهی، می‌فهمی که باید کدام بخش را دوباره بخوانی؛ لازم نیست صرفاً به خاطر احساس ناآشنایی، همه‌ی فصل را از اول تکرار کنی.</p>"},{"h":"پیش از خواندن: هدف و نقشه‌ی متن","b":"<p>قبل از شروع، از خودت بپرس دنبال چه چیزی هستی: پاسخ یک سؤال، فهم کل فصل، پیدا کردن یک تعریف یا لذت‌بردن از داستان؟ وقتی هدف روشن شود، می‌دانی کدام بخش‌ها را باید دقیق بخوانی و کدام قسمت‌ها را می‌توانی سریع‌تر مرور کنی. خواندن بی‌هدف باعث می‌شود چشم از ابتدای صفحه تا انتهای آن حرکت کند، اما ذهن نداند چه چیزی را باید نگه دارد.</p><p>یک دور سریع روی عنوان، تیترها، زیرنویس شکل‌ها، کلمات برجسته و جمع‌بندی پایانی بزن. این کار مثل نگاه‌کردن به نقشه قبل از راه‌افتادن است؛ هنوز جزئیات را یاد نگرفته‌ای، اما می‌فهمی متن چه مسیر کلی دارد. اگر فصل طولانی است، آن را به تکه‌های کوچک تقسیم کن و برای هر تکه یک پرسش بساز.</p><p>مثلاً اگر فصل درباره‌ی دستگاه گوارش است، سؤال‌هایی مثل «غذا در هر اندام چه تغییری می‌کند؟» و «مواد مفید چگونه جذب می‌شوند؟» ذهن را آماده می‌کند. هنگام خواندن، به جای شکار تمام جمله‌ها، دنبال جواب پرسش‌ها باش. بعد از پایان، سؤال‌هایی را که پاسخ نگرفته‌اند علامت بزن تا بدانی کدام بخش نیاز به بازخوانی دارد.</p><p>پیش‌خوانی نباید آن‌قدر طول بکشد که جای مطالعه‌ی اصلی را بگیرد. هدف فقط پیدا کردن نقشه است؛ اگر هنوز متن را نخوانده‌ای، از روی تیترها نتیجه‌ی قطعی نگیر. پیش‌خوانی یک حدس اولیه می‌سازد و خواندن دقیق آن حدس را اصلاح می‌کند.</p><p class=\"tech\"><span class=\"tnum\">تمرین</span> سه پرسش بساز</p><p>پیش از خواندن یک صفحه، سه پرسش درباره‌ی آن بنویس. سپس صفحه را بخوان و کنار هر پرسش جواب کوتاه یا شماره‌ی پاراگراف را ثبت کن. در پایان ببین کدام پرسش بی‌پاسخ مانده است.</p><p class=\"tech\"><span class=\"tnum\">روش سه‌مرحله‌ای برای ورود به متن</span></p><p>برای فصل‌های طولانی از یک چرخه‌ی ساده استفاده کن: اول مرور، بعد پرسش، سپس خواندن و پاسخ‌دادن. در مرحله‌ی مرور، تیترها و شکل‌ها را نگاه کن. بعد دو یا سه سؤال بنویس؛ مثلاً «این پدیده چرا اتفاق می‌افتد؟» یا «دو روش چه تفاوتی دارند؟». حالا متن را با هدف پیدا کردن پاسخ بخوان و کنار هر پاسخ یک نشانه بگذار. در پایان صفحه را ببند و جواب را بدون نگاه‌کردن بگو. این کار کمی بیشتر از چشم‌گردانیِ سریع زمان می‌برد، اما جلوی چند بار خواندن بی‌هدف را می‌گیرد. اگر سؤال خوبی پیدا نمی‌کنی، تیتر را به پرسش تبدیل کن؛ «چرخه‌ی آب» می‌تواند بشود «آب چگونه از زمین به هوا می‌رود و دوباره برمی‌گردد؟».</p><p class=\"tech\"><span class=\"tnum\">هنگام خواندن، نشانه‌گذاری کم اما هدفمند</span></p><p>برای علامت‌گذاری، از چند نشانه‌ی ثابت استفاده کن تا صفحه به رنگین‌کمان تبدیل نشود. مثلاً ستاره برای ایده‌ی اصلی، علامت سؤال برای ابهام، و خط کنار صفحه برای مثالی که مفهوم را روشن می‌کند. کنار هر بند فقط یک یادداشت کوتاه بنویس که نقش آن را مشخص کند: تعریف، دلیل، نمونه، مخالفت یا نتیجه. اگر همه‌ی جمله‌ها را برجسته کنی، علامت‌ها دیگر کمکی به انتخاب نکته‌های مهم نمی‌کنند. بعد از پایان بخش، به نشانه‌ی سؤال‌ها برگرد و ببین کدام را می‌توانی با یک بازخوانی کوتاه حل کنی و کدام به توضیح معلم یا منبع دیگری نیاز دارد. اگر چند صفحه را برای امتحان می‌خوانی، علامت‌ها را در یک فهرست کوتاه جمع کن تا در مرور بعدی مجبور نباشی تمام صفحه را دوباره بررسی کنی. این روش خواندن را فعال می‌کند، اما جای فهمیدن متن را نمی‌گیرد.</p>"},{"h":"زیرلب‌خوانی و صدای درونی","b":"<p>بسیاری از ما هنگام خواندن، واژه‌ها را بی‌صدا در ذهن تلفظ می‌کنیم. این کار را معمولاً زیرلب‌خوانی یا صدای درونی می‌نامند. وجودش به خودی خود بد نیست؛ در شعر، زبان‌آموزی یا متن پیچیده، شنیدن آهنگ جمله می‌تواند به فهم کمک کند. مشکل وقتی شروع می‌شود که هر واژه‌ی ساده را با سرعت گفتار آهسته تلفظ می‌کنی و نمی‌توانی سرعت را با متن هماهنگ کنی.</p><p>قرار نیست صدای درونی را با زور کاملاً خاموش کنی؛ این تلاش ممکن است حواس را از معنی دور کند. بهتر است در متن آسان، توجهت را روی گروه‌های کوچک واژه‌ها بگذاری و اجازه بدهی چشم جلوتر از تلفظ ذهنی حرکت کند. در متن دشوار، دوباره آهسته بخوان و از صدای درونی به عنوان ابزار فهم استفاده کن.</p><p>روش‌های فیزیکی مثل زمزمه‌کردن آهنگ بی‌کلام یا حرکت آرام انگشت روی خط برای بعضی افراد هنگام تمرین کوتاه کمک‌کننده‌اند، اما راه‌حل همگانی نیستند. اگر این کارها حواست را پرت می‌کند، کنارشان بگذار. معیار نتیجه است: آیا معنی را فهمیدی و آیا زمان خواندن بهتر شد؟</p><p>همچنین تفاوت بین خواندن با صدای بلند و خواندن بی‌صدا را به یاد داشته باش. بلندخوانی برای تمرین تلفظ و بیان مفید است؛ خواندن بی‌صدا برای مطالعه‌ی شخصی اغلب کارآمدتر است. هر کدام هدف متفاوتی دارد، پس لازم نیست یکی را همیشه جای دیگری به کار ببری.</p><p class=\"tech\"><span class=\"tnum\">تمرین ملایم</span> گروه‌های واژه را ببین</p><p>یک متن ساده انتخاب کن و با قلم زیر هر عبارت معنایی کوتاه خط بکش، نه زیر تک‌تک واژه‌ها. یک بار با سرعت معمول و یک بار با توجه به گروه‌های معنایی بخوان. اگر در نسخه‌ی دوم معنی جمله را از دست دادی، سرعت را کمتر کن.</p><p class=\"tech\"><span class=\"tnum\">زیرلب‌خوانی را مدیریت کن، نه اینکه با آن بجنگی</span></p><p>صدای درونی یک عادت طبیعی در خواندن است و خاموش‌کردن اجباری آن نه لازم است و نه برای همه شدنی. مسئله این است که در متن آسان، تلفظ ذهنیِ تک‌تک واژه‌ها ممکن است ریتم را محدود کند. برای تمرین، عبارت‌هایی را ببین که یک معنی کامل می‌سازند؛ مثل «در نتیجه‌ی کاهش دما» یا «از طرف دیگر». در همان حال، حواست به معنی بماند و از خودت نخواه که فقط سریع‌تر از صدای ذهنت حرکت کنی. در متن دشوار، شعر، متن زبان خارجی یا تعریف علمی، تلفظ درونی می‌تواند به تشخیص واژه و آهنگ جمله کمک کند؛ همان‌جا آرام‌خوانی کاملاً به‌جا است. اگر هنگام تمرین با موسیقی یا حرکت انگشت تمرکزت کمتر شد، آن ابزار را کنار بگذار؛ ابزار خوب برای هر فرد ابزاری است که به فهم کمک کند.</p><p class=\"tech\"><span class=\"tnum\">چه زمانی صدای درونی کمک می‌کند؟</span></p><p>اگر واژه‌ای ناآشنا، نام شخص، عبارت زبان خارجی یا جمله‌ای با ساختار پیچیده می‌بینی، تلفظ ذهنی آهسته‌تر می‌تواند کمک کند که اجزای عبارت را درست تشخیص بدهی. برعکس، در متن آشنا و ساده لازم نیست هر واژه را مثل خواندن بلند با یک مکث طولانی دنبال کنی. تمرین مناسب این نیست که زبانت را به زور حرکت بدهی یا تمام صدای ذهنی را خاموش کنی؛ کافی است گاهی توجه را از صدای واژه‌ها به معنی عبارت‌ها منتقل کنی. اگر برای جلوگیری از زیرلب‌خوانی مجبور می‌شوی مدام عدد بشماری یا حواست از متن پرت می‌شود، آن روش را کنار بگذار. موسیقی پس‌زمینه هم راه‌حل تضمینی نیست؛ برای بعضی‌ها حواس‌پرتی را بیشتر می‌کند و برای بعضی دیگر، در متن ساده، مزاحمت محیط را می‌پوشاند. با یک آزمون کوتاه و هم‌سطح تصمیم بگیر، نه با یک قانون همگانی.</p>"},{"h":"گستره‌ی دید و خواندن چندواژه‌ای","b":"<p>چشم هنگام خواندن پیوسته و نرم روی همه‌ی حروف نمی‌لغزد؛ معمولاً در نقطه‌هایی مکث کوتاه دارد و سپس به نقطه‌ی بعدی می‌جهد. به همین دلیل، اگر بتوانی در هر توقف یک گروه معنایی کوتاه را تشخیص بدهی، ممکن است خواندن روان‌تر شود. اما «گروه دیدن» به معنای نگاه‌کردن به کل صفحه و فهمیدن همه‌ی کلمات از گوشه‌ی چشم نیست. واژه‌های دقیق و دشوار هنوز نیاز به توجه دارند.</p><p>برای گسترش دامنه‌ی دید، از جمله‌های کوتاه و آسان شروع کن. هر بار تلاش کن دو یا سه واژه‌ی مرتبط را یک واحد ببینی، مثلاً «در پایان آزمایش» یا «به دلیل کاهش دما». به مرور می‌توانی عبارت‌های طولانی‌تر را یک‌جا تشخیص بدهی. اگر مجبور می‌شوی مرتب به عقب برگردی، احتمالاً بخش زیادی را زودتر از فهمیدن رد کرده‌ای؛ گروه را کوتاه‌تر کن.</p><p>خواندن ستونی یا حرکت زیگزاگی در صفحه گاهی برای مرور سریع یا یافتن تیترها مفید است، اما برای یادگیری خط‌به‌خط هر متن مناسب نیست. متن‌های روایی و استدلالی رابطه‌ی جمله‌ها را در ترتیب خودشان می‌سازند؛ پرش زیاد می‌تواند «چون»، «اما»، «اگر» و عبارت‌های محدودکننده را از دید پنهان کند. پس روش دیداری را با هدف کار هماهنگ کن.</p><p class=\"tech\"><span class=\"tnum\">تمرین چشم</span> مکث‌های هدفمند</p><ol><li>سه خط از یک متن آسان بردار.</li><li>با انگشت یا قلم، زیر هر عبارت معنایی حرکت کن؛ با واژه‌ها مسابقه نگذار.</li><li>پس از هر خط، نگاهت را از صفحه بردار و معنی را با زبان خودت بگو.</li><li>اگر جمله مبهم شد، همان را آهسته‌تر بخوان و رابطه‌هایش را پیدا کن.</li></ol><p>تمرین باید راحت باشد؛ خستگی چشم، سردرد یا تاری دید علامت آن است که باید مکث کنی و شرایط مطالعه را بررسی کنی.</p><p class=\"tech\"><span class=\"tnum\">گروه‌های واژه را با معنی بساز</span></p><p>چندواژه‌ای خواندن یعنی به‌تدریج عبارت‌های معنادار را یک واحد ببینی، نه اینکه بدون دقت از روی چند خط بپری. برای مثال جمله‌ی «گیاه در نبود نور کافی، رشد کندتری دارد» را می‌توان به این تکه‌ها تقسیم کرد: «گیاه / در نبود نور کافی / رشد کندتری دارد». این تقسیم‌بندی کمک می‌کند رابطه‌ی شرط و نتیجه از دست نرود. برای متن علمی، عبارت‌هایی مثل «به علت»، «در مقایسه با» و «در نتیجه» راهنما هستند؛ آن‌ها را جا نینداز، چون جهت معنی را مشخص می‌کنند. تمرین را از پاراگراف ساده شروع کن و پس از هر جمله بگو چه رابطه‌ای بیان شده است. اگر جمله را ناقص می‌فهمی، گروه‌ها را کوتاه‌تر کن. دید گسترده قرار نیست جای توجه به واژه‌های مهم، اعداد، استثناها و قیدهایی مثل «همیشه» یا «گاهی» را بگیرد.</p><p class=\"tech\"><span class=\"tnum\">تمرین دسته‌بندی عبارت‌ها</span></p><p>یک بند کوتاه انتخاب کن و با خط مورب، جمله‌ها را به گروه‌های معنایی تقسیم کن. برای نمونه، «وقتی دمای آب بالا می‌رود / بخشی از مولکول‌ها انرژی بیشتری می‌گیرند / و از سطح مایع خارج می‌شوند». حالا هر گروه را جداگانه بخوان و سپس معنی کل جمله را با زبان خودت بگو. اگر فقط گروه‌ها را سریع می‌خوانی اما نمی‌توانی رابطه‌ی میان آن‌ها را توضیح بدهی، سرعت به فهم تبدیل نشده است. در متن فارسی، مراقب نقش پیوندهایی مثل «اگر»، «با وجود این»، «به همین دلیل» و «در نتیجه» باش؛ ممکن است کوتاه باشند، اما جهت استدلال را عوض می‌کنند. همین‌طور عددها، واحدها و عبارت‌های منفی را سریع رد نکن، چون حذف «نیست» یا جابه‌جایی یک واحد می‌تواند مفهوم علمی را وارونه کند. این تمرین قرار نیست هر بار دقیقاً یک شکل داشته باشد؛ تقسیم درست همان تقسیمی است که معنی جمله را برای تو روشن‌تر می‌کند.</p>"},{"h":"اشاره‌گر یا راهنمای چشم","b":"<p>گاهی چشم روی واژه‌ها برمی‌گردد، حتی وقتی برگشت لازم نیست؛ گاهی هم از خط جا می‌ماند. حرکت ملایم قلم، انگشت یا نشانگر روی صفحه می‌تواند مسیر نگاه را مشخص کند. این ابزار به تنهایی سرعت را تضمین نمی‌کند، اما برای بعضی خواننده‌ها به حفظ ریتم و جلوگیری از پرش تصادفی کمک می‌کند.</p><p>راهنما را کمی جلوتر از سرعت طبیعی چشم حرکت بده، نه آن‌قدر تند که معنی را جا بگذاری. ابتدا حرکت را با ریتم راحت هماهنگ کن و فقط کمی سرعت را بالا ببر. اگر متن دشوار شد، سرعت اشاره‌گر را کم کن یا آن را کنار بگذار. خواندن یک رقابت مکانیکی نیست؛ وقتی جمله نیاز به مکث دارد، مکث بخشی از خواندن خوب است.</p><p>برگشتن به جمله‌ی قبلی همیشه خطا نیست. اگر مرجع ضمیر را پیدا نمی‌کنی، معادله‌ای را نفهمیدی یا یک استدلال چند مرحله دارد، برگشت هدفمند کاملاً منطقی است. چیزی که می‌خواهیم کمتر شود بازگشت بی‌دلیل از روی عادت است، نه بازخوانی لازم برای فهم. بعد از یک بخش، از خودت بپرس «برای چه برگشتم؟» اگر پاسخ روشن داری، آن برگشت احتمالاً مفید بوده است.</p><p class=\"tech\"><span class=\"tnum\">تمرین</span> راهنما را آزمایش کن</p><p>یک پاراگراف آسان را یک بار بدون راهنما و یک بار با حرکت آرام قلم بخوان. زمان و پاسخ به سه پرسش درباره‌ی متن را مقایسه کن. اگر زمان کمتر شد اما پاسخ‌ها ضعیف‌تر شد، راهنما را کندتر کن؛ اگر تفاوتی ندیدی، لازم نیست به استفاده از آن اصرار کنی.</p><p class=\"tech\"><span class=\"tnum\">از اشاره‌گر برای حفظ مسیر استفاده کن</span></p><p>قلم یا انگشت می‌تواند به چشم یک مسیر آرام بدهد، به‌خصوص وقتی در هر خط جای خود را گم می‌کنی یا بی‌دلیل به عقب برمی‌گردی. راهنما را با سرعتی حرکت بده که هنوز فرصت دیدن معنی عبارت را داشته باشی. در پایان هر بند مکث کن و بپرس «چه چیزی یاد گرفتم؟». اگر جواب روشنی نداری، سریع‌تر کردن حرکت مشکل را حل نمی‌کند. پوشاندن خطوط قبلی گاهی کمک می‌کند روی متن جدید بمانی، اما هنگام حل مسئله‌ی ریاضی یا دنبال‌کردن ارجاع یک ضمیر، برگشت به قسمت قبل ضروری است؛ پس از وسیله‌ای استفاده نکن که راه بازبینی لازم را کاملاً ببندد. برای سنجیدن فایده، یک متن هم‌سطح را یک‌بار با راهنما و یک‌بار بدون آن بخوان و هم زمان و هم پاسخ‌ها را مقایسه کن. اگر تفاوتی ندیدی، مجبور نیستی این تکنیک را نگه داری.</p><p class=\"tech\"><span class=\"tnum\">برگشت چشم را دسته‌بندی کن</span></p><p>هر بار که به خط قبلی برمی‌گردی، لازم نیست خودت را سرزنش کنی. گاهی برگشت برای اصلاح اشتباه ضروری است؛ گاهی به خاطر این است که حواست پرت شده؛ و گاهی از روی عادت رخ می‌دهد، درحالی‌که جمله را فهمیده‌ای. پس یک یا دو صفحه تمرین کن و هر وقت برگشتی، دلیلش را کوتاه یادداشت کن. اگر علت، واژه‌ی ناشناخته است، معنی واژه را پیدا کن؛ اگر علت، حواس‌پرتی است، اعلان‌ها را ببند یا متن را کوتاه‌تر کن؛ اگر فقط از عادت برمی‌گردی، می‌توانی راهنما را امتحان کنی. هدف حذف همه‌ی برگشت‌ها نیست؛ هدف این است که برگشت‌ها تصمیمی و مفید باشند. این تفاوت به‌ویژه در ریاضی، دستور زبان و استدلال‌های چندمرحله‌ای مهم است، چون بازخوانی دقیق یکی از ابزارهای فهم به شمار می‌رود.</p>"},{"h":"سرعت مناسب برای متن‌های متفاوت","b":"<p>سرعت مطالعه باید تابع متن و هدف باشد. برای پیدا کردن شماره‌ی صفحه یا مرور تیترها می‌توانی سریع نگاه کنی. برای یادگیری تعریف تازه، تشخیص تفاوت دو مفهوم یا دنبال‌کردن یک اثبات، باید مکث کنی. اگر متن از واژه‌های جدید، جمله‌های تو در تو یا ایده‌های فشرده تشکیل شده، سرعت بالا احتمالاً باعث می‌شود چند بار برگردی و در مجموع وقت بیشتری صرف کنی.</p><p>یک روش عملی این است که برای هر متن یکی از سه حالت را انتخاب کنی: مرور کلی، خواندن عادی یا مطالعه‌ی عمیق. در مرور کلی دنبال ساختار و واژه‌های کلیدی هستی؛ در خواندن عادی معنی بندها و رابطه‌ها را دنبال می‌کنی؛ در مطالعه‌ی عمیق سؤال می‌سازی، مثال بررسی می‌کنی و بخش‌های دشوار را بازخوانی می‌کنی. ممکن است در یک فصل از هر سه حالت استفاده کنی.</p><p>حالت‌های خواندن را با هم قاطی نکن. اگر قرار است درباره‌ی یک متن ادبی نظر بدهی، خواندن خیلی سریع شاید تصویر کلی بدهد اما برای بررسی لحن و انتخاب واژه کافی نیست. اگر فقط می‌خواهی بفهمی یک فصل درباره‌ی چه موضوعی است، خواندن کلمه‌به‌کلمه‌ی تمام مثال‌ها شاید استفاده‌ی خوبی از زمان نباشد.</p><p class=\"tech\"><span class=\"tnum\">تصمیم سه‌ثانیه‌ای</span> پیش از هر بخش</p><ul><li>آیا فقط دنبال اطلاعات مشخصی هستم؟ مرور هدفمند.</li><li>آیا باید موضوع را یاد بگیرم؟ خواندن عادی همراه با پرسش.</li><li>آیا این بخش دشوار یا مهم است؟ مطالعه‌ی عمیق و مکث.</li></ul><p>پس از چند جلسه، ببین این انتخاب سرعت و کیفیت پاسخ‌ها را بهتر کرده یا نه. هدف استفاده از روش مناسب است، نه اینکه همه‌ی صفحات را با یک سرعت بخوانی.</p><p class=\"tech\"><span class=\"tnum\">سرعت را پله‌پله عوض کن</span></p><p>می‌توانی در یک فصل از سه ریتم استفاده کنی. در «مرور»، عنوان‌ها و ساختار را پیدا می‌کنی؛ در «خواندن عادی»، رابطه‌های اصلی را دنبال می‌کنی؛ و در «مطالعه‌ی عمیق»، مثال حل می‌کنی، سؤال می‌سازی و جمله‌های پیچیده را دوباره می‌خوانی. قبل از هر بخش، تصمیم بگیر کدام ریتم مناسب است. مثلاً برای پیدا کردن تعریف یک اصطلاح، مرور هدفمند کافی است؛ اما برای فهمیدن اینکه چرا یک فرمول کار می‌کند، باید مراحل استدلال را دنبال کنی. پس از پایان بخش هم ریتم را بازبینی کن: اگر از متن سؤال مهمی بی‌پاسخ مانده، زمان بیشتری به همان بخش بده. لازم نیست کل فصل را دوباره از ابتدا بخوانی؛ فقط نقطه‌ی مبهم را پیدا کن و همان قسمت را دقیق‌تر مطالعه کن.</p><p class=\"tech\"><span class=\"tnum\">سرعت با دشواری متن بالا و پایین می‌شود</span></p><p>دو صفحه‌ی هم‌حجم لزوماً زمان یکسانی نمی‌خواهند. یک صفحه‌ی داستانی آشنا شاید سریع خوانده شود، اما یک صفحه‌ی دارای نمودار، اصطلاح تخصصی یا استدلال چندمرحله‌ای به مکث نیاز دارد. موقعی که به مفهوم تازه می‌رسی، یک مثال برای خودت بساز؛ در متن استدلالی، ادعا و دلیل را جدا کن؛ و در متن راهنما، ترتیب مراحل را نگه دار. پس از یک بخش کوتاه، تصمیم بگیر آیا می‌توانی آن را برای کسی توضیح بدهی. اگر نه، به‌جای زیادکردن سرعت یا تکرار مکانیکی، نوع فعالیت را عوض کن: یک پرسش بساز، شکل را بررسی کن یا مثال ساده‌تری پیدا کن. خواننده‌ی ماهر کسی نیست که همیشه تند بخواند؛ کسی است که می‌فهمد چه زمانی باید سریع مرور کند و چه زمانی باید توقف کند.</p>"},{"h":"درک مطلب؛ نگهبان اصلی سرعت","b":"<p>درک مطلب را بعد از خواندن با یک آزمون کوتاه بسنج، نه با احساس آشنایی هنگام نگاه‌کردن. اگر متن را می‌بینی و جمله‌ها برایت آشنا هستند، به این معنی نیست که می‌توانی آن را توضیح بدهی. پس از پایان هر بخش، منبع را ببند و سه چیز را از حافظه بازسازی کن: ایده‌ی اصلی، دلیل یا جزئیات مهم، و رابطه‌ی بین آن‌ها. در متن روایی می‌توانی به‌جای دلیل، تغییر مهم شخصیت یا ترتیب اتفاق‌ها را بگویی.</p><p>اگر نتوانستی، تشخیص بده مشکل از کجاست. شاید واژه‌ای را نمی‌شناسی؛ شاید جمله طولانی است؛ شاید مفهوم پیش‌نیاز لازم دارد؛ یا شاید فقط خیلی سریع رد شده‌ای. هر مشکل راه‌حل متفاوتی دارد. واژه‌ی تازه را پیدا کن، جمله را به بخش‌های کوچک‌تر تقسیم کن، پیش‌نیاز را مرور کن یا همان بند را با سرعت کمتر بخوان.</p><p>خلاصه‌ی یک یا دو جمله‌ای راه دیگری برای آزمون فهم است. خلاصه را به متن نگاه‌نکرده بنویس و بعد با اصل مطلب مقایسه کن. دقت کن که ادعا را بزرگ‌تر از متن نکنی؛ «ممکن است کمک کند» با «حتماً باعث می‌شود» فرق دارد. اگر محدودیت یا استثنا را حذف کنی، شاید خلاصه خوش‌خوان‌تر شود اما فهمت دقیق نمانده است.</p><p class=\"tech\"><span class=\"tnum\">آزمون سه‌پرسشی</span></p><ol><li>این قسمت در یک جمله درباره‌ی چیست؟</li><li>کدام دلیل، مثال یا جزئیات اصلی آن را پشتیبانی می‌کند؟</li><li>نویسنده چه محدودیت یا نتیجه‌ای بیان می‌کند؟</li></ol><p>اگر جواب یکی را نداری، فقط همان قسمت را دوباره بخوان. بازخوانی هدفمند از شروع دوباره‌ی کل متن سریع‌تر است.</p><p class=\"tech\"><span class=\"tnum\">خودآزمایی سه‌تکه‌ای</span></p><p>پس از هر چند صفحه، کتاب را ببند و سه کار انجام بده: در یک جمله پیام اصلی را بگو، دو نکته‌ی پشتیبان را نام ببر، و رابطه‌ی بین آن‌ها را توضیح بده. اگر متن درباره‌ی مقایسه است، بگو معیار مقایسه چه بود؛ اگر درباره‌ی یک فرایند است، مراحل را به ترتیب بیان کن. بعد یک پرسش بساز که جوابش عیناً در متن نوشته نشده باشد، ولی بتوان آن را از اطلاعات متن نتیجه گرفت. چنین سؤالی نشان می‌دهد فقط عبارت‌ها را حفظ نکرده‌ای و می‌توانی از آن‌ها استفاده کنی. اگر پاسخ ناقص بود، مشخص کن کدام قسمت جا افتاده: واژه، رابطه یا نتیجه‌گیری. همان قسمت را دوباره بخوان و دوباره از حافظه پاسخ بده. پاسخ را با جمله‌های کوتاه خودت بیان کن؛ لازم نیست عبارت‌های کتاب را عیناً تکرار کنی.</p><p class=\"tech\"><span class=\"tnum\">از فهم سطحی تا فهم قابل‌استفاده</span></p><p>برای تشخیص اینکه مطلب را واقعاً فهمیده‌ای، تنها به پرسش «موضوع چه بود؟» اکتفا نکن. سه سطح سؤال طرح کن: یک سؤال برای یادآوری اطلاعات، یکی برای توضیح رابطه، و یکی برای کاربرد در موقعیت تازه. برای مثال، درباره‌ی چرخه‌ی آب، یادآوری یعنی نام‌بردن از تبخیر؛ توضیح یعنی بیان اینکه گرما چطور در تغییر حالت نقش دارد؛ و کاربرد یعنی پیش‌بینی اینکه چرا خشک‌شدن لباس در شرایط مختلف فرق می‌کند. جواب سؤال سوم لازم نیست پیچیده باشد، ولی باید نشان بدهد مفهوم را به شرایط تازه منتقل کرده‌ای. اگر پاسخ اشتباه بود، آن را به نشانه‌ای برای مطالعه تبدیل کن: کدام گام را نفهمیده‌ای؟ پس از اصلاح، همان سؤال را دوباره از حافظه پاسخ بده. این روش از تکرار بی‌هدف جلوگیری می‌کند و باعث می‌شود زمان مرور به بخش‌هایی برسد که بیشترین نیاز را دارند.</p>"},{"h":"تمرین سرعت و ثبت پیشرفت","b":"<p>برای بالا بردن سرعت، اندازه‌گیری منظم بهتر از حدس‌زدن است. یک متن هم‌سطح انتخاب کن، مدت خواندن و تعداد واژه‌ها را ثبت کن و بعد از آن چند پرسش پاسخ بده. سرعت تقریبی برابر تعداد واژه‌های خوانده‌شده تقسیم بر زمان به دقیقه است، اما این عدد را تنها معیار نگذار. برای متن‌های متفاوت مقایسه‌ی مستقیم منصفانه نیست؛ متن علمی دشوار با داستان آشنا از نظر واژگان و ساختار یکسان نیست.</p><p>در هر جلسه فقط یک چیز را تمرین کن: حرکت راهنما، خواندن گروهی عبارت‌ها، پیش‌خوانی یا خلاصه‌گویی. اگر همه را یک‌باره عوض کنی، نمی‌فهمی کدام روش کمک کرده است. ثبت نتیجه می‌تواند چهار ستون داشته باشد: نوع متن، زمان، پاسخ درست به پرسش‌ها و روش استفاده‌شده. بعد از چند جلسه، به روند نگاه کن؛ نوسان یک روزه نتیجه‌ی قطعی نیست.</p><p>از عددهای نمایشی مثل «هزار واژه در دقیقه برای همه» انتظار واقع‌بینانه نساز. سرعت مناسب به متن، زبان، پیش‌دانسته‌ها و هدف وابسته است. بعضی متن‌ها باید آهسته و چندباره خوانده شوند. افزایش قابل‌اعتماد یعنی با زمان مناسب‌تر، فهم یکسان یا بهتر به دست بیاوری؛ نه اینکه صرفاً عقربه‌ی سرعت بالاتر برود.</p><p class=\"tech\"><span class=\"tnum\">فرم ساده‌ی پیگیری</span></p><p>پس از هر بار تمرین بنویس: «متن: … / مدت: … / سه پرسش درست: … از ۳ / روش: … / نکته‌ای که دفعه‌ی بعد تغییر می‌دهم: …». همین ثبت کوتاه کمک می‌کند از تجربه‌های مبهم نتیجه‌ی دقیق‌تر بگیری.</p><p class=\"tech\"><span class=\"tnum\">چطور پیشرفت را منصفانه اندازه بگیریم؟</span></p><p>برای محاسبه‌ی تقریبی سرعت، تعداد واژه‌ها را بر زمان برحسب دقیقه تقسیم کن؛ اگر مدت را به ثانیه داری، تعداد واژه‌ها را در ۶۰ ضرب کن و بر ثانیه‌ها تقسیم کن. این عدد فقط وقتی قابل‌مقایسه است که طول، دشواری و موضوع متن‌ها تقریباً مشابه باشد. در کنار آن، از خودت پنج سؤال بپرس یا یک خلاصه‌ی کوتاه بنویس و نتیجه را ثبت کن. نمونه‌ی برگه‌ی ثبت: تاریخ، نوع متن، مدت مطالعه، سرعت تقریبی، پاسخ درست از پنج سؤال، و یک نکته‌ای که لازم است دوباره یاد بگیری. آزمون اول را خط پایه نگه دار؛ آزمون بعدی را در شرایطی نزدیک به همان شرایط انجام بده. یک روز خسته یا یک متن دشوار را مبنای قضاوت نهایی قرار نده. اگر عددها تغییر می‌کنند اما فهم ثابت مانده، تمرین را با ریتمی ادامه بده که هم راحت باشد و هم دقت را حفظ کند.</p><p class=\"tech\"><span class=\"tnum\">سرعت را با یک مثال محاسبه کن</span></p><p>فرض کن متنی ۶۰۰ واژه‌ای را در چهار دقیقه خوانده‌ای. سرعت تقریبی تو ۱۵۰ واژه در دقیقه است؛ اما اگر فهم فقط دو پاسخ از پنج سؤال باشد، نباید این عدد را موفقیت کامل حساب کنی. در آزمون بعدی بهتر است متن هم‌سطح انتخاب شود و هم زمان و هم فهم ثبت شود. یک جدول ساده کافی است: نام یا موضوع متن، تعداد واژه اگر معلوم است، مدت مطالعه، پاسخ درست، و یک نکته‌ی دشوار. لازم نیست هر روز رکورد تازه‌ای ثبت کنی؛ اختلاف کوچک بین دو آزمون می‌تواند از تفاوت متن یا خستگی باشد. پس از چند نوبت، روند را نگاه کن. اگر سرعت و فهم هر دو بهتر می‌شوند، روش احتمالاً کمک کرده است. اگر فقط سرعت افزایش می‌یابد، به خواندن دقیق‌تر و پرسش‌سازی برگرد. اگر فهم بهتر شده ولی زمان کمی بیشتر شده، ممکن است هنوز پیشرفت کرده باشی؛ مخصوصاً وقتی هدف یادگیری مطلب دشوار است.</p>"},{"h":"خطاهای رایج و باورهای نادرست","b":"<p>یکی از خطاهای رایج این است که هر نوع برگشت چشم را ممنوع کنیم. گاهی برگشت برای فهم لازم است؛ مشکل، برگشت‌های مکرر بدون سؤال مشخص است. خطای دیگر، تندخوانی همیشگی است. خواندن سریع متن ساده خوب است اما اگر برای فهم یک تعریف دشوار لازم است چند ثانیه مکث کنی، آن مکث اتلاف وقت نیست.</p><p>باور نادرست دیگر این است که باید همیشه کلمه‌ها را دسته‌ای ببینی یا صدای درونی را کاملاً حذف کنی. بعضی متن‌ها به خواندن دقیق واژه‌به‌واژه نیاز دارند و صدای درونی می‌تواند فهم آهنگ و ساختار جمله را تقویت کند. تکنیک وقتی خوب است که در موقعیت مناسب کمک کند و بتوانی در صورت نیاز آن را کنار بگذاری.</p><p>نور نامناسب، خستگی، صفحه‌ی کوچک، فاصله‌ی زیاد یا کم و حواس‌پرتی هم سرعت مؤثر را پایین می‌آورد. اگر چشم خسته شده یا ذهن دیگر مطلب را دنبال نمی‌کند، ادامه‌دادن با فشار ممکن است تنها خطا را بیشتر کند. استراحت کوتاه و برگشتن به متن با هدف روشن، بخشی از روش مطالعه است.</p><p class=\"tech\"><span class=\"tnum\">بازبینی باور</span></p><p>هر ادعای شگفت‌انگیز درباره‌ی افزایش چندبرابری سرعت را با سه سؤال بررسی کن: درک مطلب چگونه سنجیده شده؟ متن‌ها هم‌سطح بوده‌اند؟ نتیجه برای چه گروهی گزارش شده؟ تجربه‌ی شخصی می‌تواند جالب باشد، اما برای نتیجه‌ی عمومی به شواهد معتبرتر نیاز داریم.</p><p class=\"tech\"><span class=\"tnum\">چند باور فریبنده درباره‌ی تندخوانی</span></p><p>باور اول این است که هرچه چشم سریع‌تر حرکت کند، ذهن هم الزاماً بیشتر یاد می‌گیرد؛ درحالی‌که برای فهم ایده‌های پیچیده زمان پردازش لازم است. باور دوم این است که همه‌ی برگشت‌های چشم بد هستند؛ برگشتِ هدفمند برای پیدا کردن مرجع یک واژه یا اصلاح برداشت اشتباه می‌تواند بسیار مفید باشد. باور سوم این است که یک عدد ثابت مثل «هزار واژه در دقیقه» برای همه و همه‌ی متن‌ها هدف مناسبی است؛ در واقع، زبان، موضوع، پیش‌زمینه‌ی خواننده و هدف مطالعه تفاوت زیادی ایجاد می‌کنند. باور چهارم این است که باید همه‌ی متن‌ها را با یک روش خواند؛ در حالی‌که مرور خبر، یادگیری فصل علوم و تحلیل شعر نیازهای متفاوتی دارند. پس به جای اعتماد به وعده‌های عجیب، نتیجه‌ی خودت را با فهم، دقت و توانایی توضیح‌دادن بسنج.</p><p class=\"tech\"><span class=\"tnum\">فریب وعده‌های بی‌پشتوانه را نخور</span></p><p>گاهی تبلیغ می‌بینی که وعده می‌دهد در یک جلسه چند برابر سریع‌تر بخوانی یا تمام متن‌ها را بدون افت فهم از روی صفحه دریافت کنی. برای ارزیابی چنین ادعایی بپرس: سرعت چگونه اندازه‌گیری شده؟ آزمون درک مطلب چه بوده؟ آیا متن قبل و بعد هم‌سطح بوده‌اند؟ آیا نتیجه برای مدت طولانی باقی مانده یا فقط در یک تست کوتاه به دست آمده است؟ روش‌هایی مثل مرور هدفمند، کاهش حواس‌پرتی و تمرین گروه‌های معنایی می‌توانند مفید باشند، اما هیچ‌کدام جای دانستن واژه‌ها، پیش‌زمینه‌ی لازم و فکرکردن را نمی‌گیرند. چشم انسان نمی‌تواند همه‌ی جزئیات هر صفحه را فقط با یک نگاه سریع به دانشی پایدار تبدیل کند. در برابر وعده‌های خارق‌العاده، به شواهد عملی خودت تکیه کن و اگر روشی فهمت را پایین می‌آورد، حتی اگر سرعت ظاهری را زیاد کند، آن را موفق تلقی نکن.</p>"},{"h":"برنامه‌ی تمرین سی‌روزه و واژه‌نامه","b":"<p>برنامه‌ی سی‌روزه را کوتاه و تدریجی نگه دار. هفته‌ی اول سرعت پایه و فهم را ثبت کن و فقط روی پیش‌خوانی و هدف‌گذاری تمرکز داشته باش. هفته‌ی دوم حرکت راهنما و گروه‌های معنایی را در متن‌های آسان تمرین کن. هفته‌ی سوم، سرعت خواندن را متناسب با نوع متن تغییر بده و پس از هر بخش سؤال پاسخ بده. هفته‌ی چهارم سراغ متن‌های کمی دشوارتر برو و ببین آیا می‌توانی سرعت را بدون قربانی‌کردن دقت حفظ کنی.</p><p>اگر یک روز تمرین را از دست دادی، لازم نیست از اول شروع کنی. جلسه‌ی بعد از همان جایی که هستی ادامه بده. هر چند روز یک بار استراحت یا خواندن آزاد هم داشته باش؛ همه‌ی مطالعه نباید به آزمون سرعت تبدیل شود. هدف این است که خواندن در زندگی روزانه مفیدتر و دلپذیرتر شود.</p><p><b>واژه‌نامه‌ی ساده:</b> «پیش‌خوانی» یعنی ساختن نقشه‌ی کلی پیش از مطالعه‌ی دقیق؛ «راهنما» یا Pacer وسیله‌ای برای دنبال‌کردن مسیر چشم؛ «زیرلب‌خوانی» صدای درونی هنگام خواندن؛ «درک مطلب» توانایی توضیح معنی و رابطه‌های متن؛ «خواندن فعال» مطالعه همراه با پرسش و بازسازی معنی است.</p><p class=\"tech\"><span class=\"tnum\">آزمون پایانی</span></p><details><summary>۱) آیا سریع‌ترین سرعت، همیشه بهترین است؟</summary><p>نه. سرعت باید با هدف و دشواری متن هماهنگ باشد و درک مطلب حفظ شود.</p></details><details><summary>۲) آیا برگشت به جمله‌ی قبل همیشه اشتباه است؟</summary><p>نه؛ برگشت هدفمند برای فهم مفهومی دشوار یا پیدا کردن مرجع یک واژه می‌تواند لازم باشد.</p></details><details><summary>۳) پیشرفت را چگونه بسنجیم؟</summary><p>سرعت را کنار پاسخ به پرسش‌های فهم و نوع متن ثبت کن؛ عدد سرعت به تنهایی کافی نیست.</p></details><p>برای ادامه، یک کتابی را انتخاب کن که واقعاً دوست داری بخوانی. از روش‌ها برای پشتیبانی از خواندن استفاده کن، نه اینکه لذت و فهم را فدای عدد کنی.</p><p class=\"tech\"><span class=\"tnum\">برنامه‌ی پیشنهادی و سنجش پایان دوره</span></p><p>در هفته‌ی اول، یک متن هم‌سطح انتخاب کن و سرعت و فهم فعلی را ثبت کن. در هفته‌ی دوم، پیش‌خوانی و ساختن سؤال را قبل از هر مطالعه تمرین کن. در هفته‌ی سوم، گروه‌بندی عبارت‌ها و استفاده‌ی آزمایشی از اشاره‌گر را روی متن ساده امتحان کن. در هفته‌ی چهارم، همان آزمون آغازین را با متن هم‌سطح تکرار کن و نتیجه را مقایسه کن. هر جلسه می‌تواند کوتاه باشد؛ مهم این است که پس از هر بخش فهم را بررسی کنی. واژه‌نامه: «خط پایه» اندازه‌گیری آغازین برای مقایسه؛ «پیش‌خوانی» دیدن ساختار پیش از خواندن دقیق؛ «خودآزمایی» پاسخ‌دادن بدون نگاه به منبع؛ «ریتم مطالعه» سرعت متناسب با هدف و دشواری. پرسش پایانی: اگر سرعتت بالا رفت اما نمی‌توانی پیام متن را توضیح بدهی، چه چیزی را باید تغییر بدهی؟ پاسخ مناسب، کم‌کردن سرعت یا اصلاح روش و سپس سنجش دوباره‌ی فهم است.</p><p class=\"tech\"><span class=\"tnum\">آزمون پایانی و انتخاب گام بعدی</span></p><p>پیش از پایان دوره، یک متن مناسب سطح خودت انتخاب کن و آزمون آغازین را با شرایط مشابه تکرار کن. ابتدا بدون نگاه به متن، ایده‌ی اصلی را در یک جمله بنویس؛ سپس دو نکته‌ی پشتیبان و یک سؤال کاربردی ثبت کن. بعد زمان و پاسخ‌ها را با خط پایه مقایسه کن. اگر سرعت بیشتر شده اما ایده‌ی اصلی را اشتباه نوشته‌ای، لازم است روی فهم کار کنی. اگر فهم حفظ شده و چند دقیقه صرفه‌جویی کرده‌ای، این نتیجه قابل‌استفاده است. در هفته‌های بعد به جای تمرین همه‌ی تکنیک‌ها در هر جلسه، یکی را انتخاب کن: پیش‌خوانی، گروه‌بندی عبارت‌ها، راهنمای چشم یا خودآزمایی. واژه‌نامه‌ی پایانی: «درک مطلب» توانایی بازگویی و استفاده از اطلاعات؛ «خط پایه» نتیجه‌ی نخست برای مقایسه؛ «مرور هدفمند» پیدا کردن بخش مناسب برای پاسخ به پرسش؛ «بازخوانی مفید» برگشت آگاهانه برای حل ابهام. یادگیری تندخوانی با انتخاب درست سرعت شروع می‌شود، نه با عجله‌کردن.</p>"}];
const KEY = "lp_speed-reading";
let open = null;
try{ open = localStorage.getItem(KEY); }catch(e){}
if(open!==null) open = parseInt(open);
const AUDIO = ["Sound/01-speed-reading-01.mp3", "Sound/01-speed-reading-02.mp3", "Sound/01-speed-reading-03.mp3", "Sound/01-speed-reading-04.mp3", "Sound/01-speed-reading-05.mp3", "Sound/01-speed-reading-06.mp3", "Sound/01-speed-reading-07.mp3", "Sound/01-speed-reading-08.mp3", "Sound/01-speed-reading-09.mp3", "Sound/01-speed-reading-10.mp3"];

const store={get(k,d){try{const v=localStorage.getItem(KEY+'_'+k);return v===null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+'_'+k,v);}catch(e){}}};
const FA_D='۰۱۲۳۴۵۶۷۸۹';
const faT=s=>{s=Math.max(0,Math.floor(s||0));const m=Math.floor(s/60),r=s%60;const f=n=>String(n).replace(/[0-9]/g,d=>FA_D[d]);return f(m)+':'+String(r).padStart(2,'0').replace(/[0-9]/g,d=>FA_D[d]);};
const SVG_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg>';
const SVG_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="#fff"/></svg>';
const SVG_VOL='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="#fff"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const SVG_MUTE='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="#fff"/><path d="M16 9l6 6M22 9l-6 6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const audios=AUDIO.map((src,i)=>{
  const a=new Audio();a.preload='metadata';a.src=src;
  a.volume=parseFloat(store.get('vol','1'));if(isNaN(a.volume))a.volume=1;
  a.muted=store.get('mut','0')==='1';
  const sv=(store.get('last','')||'').split('|');const saved=(+sv[0]===i&&open===i)?(parseFloat(sv[1])||0):0;let lastSave=0;
  a.addEventListener('loadedmetadata',()=>{if(saved>1&&a.duration&&saved<a.duration-5){try{a.currentTime=saved;}catch(e){}}syncUI(i);});
  a.addEventListener('timeupdate',()=>{syncUI(i);const n=Date.now();if(n-lastSave>4000){lastSave=n;store.set('last',i+'|'+a.currentTime.toFixed(1));}});
  a.addEventListener('play',()=>{audios.forEach((o,j)=>{if(j!==i&&!o.paused)o.pause();});syncUI(i);});
  a.addEventListener('pause',()=>{store.set('last',i+'|'+a.currentTime.toFixed(1));syncUI(i);});
  a.addEventListener('ended',()=>{store.set('last',i+'|0');try{a.currentTime=0;}catch(e){}syncUI(i);});
  return a;
});
function syncUI(i){const box=document.querySelector('.ap[data-i="'+i+'"]');if(!box)return;const a=audios[i];box.classList.toggle('off',!(a.duration>0));box.querySelector('.pp').innerHTML=a.paused?SVG_PLAY:SVG_PAUSE;const d=a.duration||0,c=a.currentTime||0;box.querySelector('.fill').style.width=(d>0?(c/d*100):0)+'%';box.querySelector('.tm').textContent=faT(c)+' / '+faT(d);box.querySelector('.mu').innerHTML=(a.muted||a.volume===0)?SVG_MUTE:SVG_VOL;const v=box.querySelector('.vol');if(document.activeElement!==v)v.value=a.muted?0:a.volume;}
function apToggle(i){const a=audios[i];if(a.paused){a.play().catch(()=>{});}else{a.pause();}}
function apSeek(i,ev){const a=audios[i];if(!a.duration)return;const bar=ev.currentTarget,r=bar.getBoundingClientRect();let p=(ev.clientX-r.left)/r.width;if(getComputedStyle(bar).direction==='rtl')p=1-p;a.currentTime=Math.min(Math.max(p,0),1)*a.duration;syncUI(i);}
function apVol(i,v){v=parseFloat(v);audios.forEach(a=>{a.volume=v;if(v>0)a.muted=false;});store.set('vol',String(v));store.set('mut',v===0?'1':'0');audios.forEach((_,j)=>syncUI(j));}
function apMute(){const m=!audios[0].muted;audios.forEach(a=>{a.muted=m;});store.set('mut',m?'1':'0');audios.forEach((_,j)=>syncUI(j));}
function playerHTML(i){const vv=store.get('mut','0')==='1'?0:store.get('vol','1');return '<div class="ap off" data-i="'+i+'"><button class="pp" onclick="apToggle('+i+')" aria-label="پخش / مکث">'+SVG_PLAY+'</button><div class="bar" onclick="apSeek('+i+',event)"><div class="fill"></div></div><span class="tm">۰:۰۰ / ۰:۰۰</span><button class="mu" onclick="apMute()" aria-label="بی‌صدا">'+SVG_VOL+'</button><input class="vol" type="range" min="0" max="1" step="0.05" value="'+vv+'" oninput="apVol('+i+',this.value)" aria-label="بلندی صدا"></div>';}
function toggle(i){ open = (open===i) ? null : i; try{ open===null?localStorage.removeItem(KEY):localStorage.setItem(KEY,open) }catch(e){} render(); }
function render(){
  document.getElementById("app").innerHTML = SECTIONS.map((s,i)=>{
    const o = open===i;
    return `<section class="item${o?' open':''}">
      <div class="hd" onclick="toggle(${i})"><span class="num">${i+1}</span><span class="t">${s.h}</span><span class="chev">◂</span></div>
      <div class="body"><div class="inner">${playerHTML(i)}${s.b}</div></div>
    </section>`;
  }).join("");
}
render();
audios.forEach((_,j)=>syncUI(j));
</script>
<script>
(function(){var b=document.getElementById("theme");
function cur(){return document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}
function paint(){b.textContent=cur()==="dark"?"☀":"☾";}
b.onclick=function(){var n=cur()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("amz-theme",n);}catch(e){}paint();};paint();})();
</script>
