<style>
:root{
  --hue:338;
  --bg:#f4f5fb; --card:#ffffff; --card-b:#e7e8f2; --text:#1b1c26; --muted:#6b7080;
  --accent: hsl(var(--hue) 78% 46%);
  --accent2: hsl(calc(var(--hue) + 40) 85% 55%);
  --glow: hsl(var(--hue) 90% 60%);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d0e14; --card:#171826; --card-b:#262838; --text:#eef0f7; --muted:#9aa0b4;
    --accent: hsl(var(--hue) 85% 62%); --accent2: hsl(calc(var(--hue) + 40) 90% 65%); }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn','Tahoma',sans-serif;
  overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.glow{position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0;pointer-events:none}
.g1{width:260px;height:260px;background:var(--glow);top:-80px;right:-60px}
.g2{width:220px;height:220px;background:var(--accent2);bottom:10%;left:-70px;opacity:.25}
header{position:sticky;top:0;z-index:5;padding:16px 18px calc(14px + env(safe-area-inset-top,0px));
  background:linear-gradient(135deg, hsl(var(--hue) 70% 20%), hsl(calc(var(--hue)+30) 70% 14%));
  color:#fff;box-shadow:0 6px 24px -8px hsl(var(--hue) 70% 30% / .6)}
header .crumb{font-size:11px;opacity:.75;margin-bottom:4px}
header h1{margin:0;font-size:18px;font-weight:800;line-height:1.5}
main{position:relative;z-index:1;padding:14px 14px 40px;max-width:540px;margin:0 auto}
.item{margin-bottom:12px;border-radius:18px;overflow:hidden;background:var(--card);
  border:1px solid var(--card-b);box-shadow:0 4px 18px -10px rgba(0,0,0,.25);transition:box-shadow .25s}
.item.open{box-shadow:0 8px 28px -8px hsl(var(--hue) 70% 40% / .35)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;
  cursor:pointer;user-select:none}
.hd .num{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.hd .t{flex:1;font-size:14.5px;font-weight:700}
.hd .chev{color:var(--accent);font-size:12px;transition:transform .25s ease}
.item.open .chev{transform:rotate(90deg)}
.body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.item.open .body{max-height:12000px}
.inner{padding:0 18px 16px 18px;font-size:13.5px;line-height:2;color:var(--text)}
.inner p{margin:0 0 8px}
.inner ul{margin:6px 0 0;padding-inline-start:20px}
.inner li{margin-bottom:5px;color:var(--muted)}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:11px;padding:6px 0 26px}

header .meta{font-size:11px;opacity:.85;margin-top:4px}
.inner figure{margin:12px 0;padding:10px;border:1px solid var(--card-b);border-radius:14px;background:var(--bg)}
.inner figure img{width:100%;height:auto;border-radius:10px;display:block}
.inner figcaption{font-size:12px;color:var(--muted);line-height:1.9;margin-top:8px;text-align:center}
.inner .ref{color:var(--accent);font-weight:800}

.inner ol{margin:6px 0 0;padding-inline-start:20px}
.inner ol li{margin-bottom:5px;color:var(--muted)}
.inner .tech{font-weight:800;font-size:14px;margin:14px 0 6px;padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--card-b)}
.inner .tnum{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:20px;padding:2px 10px;margin-left:8px}

.ap{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;margin:0 0 10px;border:1px solid var(--card-b);border-radius:999px;background:var(--bg)}
.ap .pp,.ap .mu{flex:none;width:22px;height:22px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ap .pp svg,.ap .mu svg{width:12px;height:12px}
.ap .bar{flex:1;height:4px;border-radius:4px;background:var(--card-b);cursor:pointer;overflow:hidden}
.ap .fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.ap .tm{flex:none;font-size:10px;color:var(--muted);white-space:nowrap;min-width:70px;text-align:center}
.ap .vol{flex:none;width:80px;accent-color:var(--accent);cursor:pointer;padding:0;direction:ltr}

header.heading{position:static;background:none;box-shadow:none;padding:14px 14px 0;color:inherit;max-width:540px;margin:0 auto 15px;display:grid;grid-template-columns:minmax(0,1fr) auto 39px;gap:7px;align-items:center;margin:0 2px 15px}
.heading small{color:var(--accent);font-size:10px}
.heading h1{margin:2px 0;font-size:23px;line-height:1.5}
.heading .en{font-size:10px;color:var(--muted);direction:ltr;text-align:right;letter-spacing:1px}
.heading .meta{font-size:10px;color:var(--muted);margin-top:3px}
.brand{display:flex;justify-content:center;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.3px;color:var(--accent)}
.tag{direction:ltr;font-size:10px;letter-spacing:.5px;background:linear-gradient(135deg,#9becbe,#36a57c);color:#092c20;padding:3px 9px;border-radius:6px;font-weight:800}
.header-brand{flex-direction:column;gap:4px;font-size:14px;line-height:1.45;white-space:nowrap}
.header-brand .tag{font-size:7px;padding:3px 5px}
.theme{background:var(--card);border:1px solid var(--card-b);border-radius:50%;width:39px;height:39px;color:var(--accent);font-size:20px;cursor:pointer}
footer{border-top:1px solid var(--card-b);padding-top:20px;margin-top:25px}
footer p{margin:5px 0}footer .brand{font-size:17px;margin:10px 0}footer strong{font-size:11px;color:var(--text)}
.lesson-nav{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.lnav{font-size:12px;font-weight:800;color:var(--accent);text-decoration:none;border:1px solid var(--card-b);background:var(--card);border-radius:999px;padding:8px 18px}
html[data-theme="light"]{--bg:#f4f5fb;--card:#ffffff;--card-b:#e7e8f2;--text:#1b1c26;--muted:#6b7080;--accent:hsl(338 78% 46%);--accent2:hsl(378 85% 55%);color-scheme:light}
html[data-theme="dark"]{--bg:#0d0e14;--card:#171826;--card-b:#262838;--text:#eef0f7;--muted:#9aa0b4;--accent:hsl(338 85% 62%);--accent2:hsl(378 90% 65%);color-scheme:dark}
#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center}
#loader.done{opacity:0;pointer-events:none;transition:opacity .4s}
.ld-box{position:relative;width:170px;text-align:center}
.ld-box svg{width:170px;height:170px;transform:rotate(-90deg)}
.ld-bg,.ld-fg{fill:none;stroke-width:12}
.ld-bg{stroke:var(--card-b)}.ld-fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377}
.ld-num{position:absolute;top:56px;width:100%;font-size:32px;font-weight:800}
.ld-cap{margin-top:10px;font-size:12px;color:var(--muted)}

.inner figure.fr{padding:8px}
.inner figure .frame{position:relative;width:100%;aspect-ratio:720/392;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--card-b),var(--bg));display:flex;align-items:center;justify-content:center}
.inner figure .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0;z-index:1}
.inner figure .frame img.x{display:none}
.frame .ph{position:relative;z-index:0;text-align:center;font-size:12px;font-weight:800;color:var(--accent);padding:0 14px;line-height:1.9}
.frame .ph i{display:block;font-style:normal;font-size:26px;opacity:.55}
.ap.off{opacity:.45;pointer-events:none}
.inner pre{direction:ltr;text-align:left;overflow-x:auto;background:var(--bg);border:1px solid var(--card-b);border-radius:10px;padding:10px;font-size:12px;line-height:1.7;margin:8px 0}
.inner details{margin:6px 0;border:1px solid var(--card-b);border-radius:10px;padding:8px 12px;background:var(--bg)}
.inner summary{cursor:pointer;font-weight:700;font-size:13px}
.inner details p{margin:8px 0 0;color:var(--muted)}

.inner .dlg{margin:10px 0;padding:10px 14px;border-radius:14px;background:var(--bg);border:1px dashed var(--card-b)}
.inner .dlg p{margin:0 0 6px;line-height:1.95}
.inner .dlg p:last-child{margin-bottom:0}
.inner .dlg b{color:var(--accent);margin-left:4px}
.inner .an{margin:10px 0;padding:10px 14px;border-radius:12px;border-inline-start:4px solid var(--accent);background:var(--bg)}
.inner .mx{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700}
.inner .lk{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px dotted var(--accent)}
</style>

<script>
const SECTIONS = [{"h":"موسیقی هم یک زبان است","b":"<p>موسیقی مثل هر زبان، حروف (نت‌ها)، ضرب‌آهنگ (ریتم)، دستور (گام و آکورد) و علامت‌های نوشتاری دارد. تئوری موسیقی همین قواعد است. لازم نیست آهنگساز یا نوازنده باشید تا از آن لذت ببرید؛ ولی اگر یک ساز را شروع کنید یا بخواهید آهنگی را بخوانید، دانستن این اصول مثل داشتن نقشه در شهر ناآشناست. این درس بر پایه‌ی نظام رایج موسیقی غربی (که در دبستان و دبیرستان و آموزشگاه‌ها تدریس می‌شود) پیش می‌رود و در پایان اشاره‌ای به موسیقی ایرانی دارد. <span class=\"ref\">تصویر شماره ۱</span> را ببینید.</p>\n<figure class=\"fr\"><div class=\"frame\"><span class=\"ph\"><i>🖼</i>تصویر شماره ۱</span><img src=\"exam-pics/34-music-theory-img01-lang.jpg\" alt=\"تصویر شماره ۱ ـ موسیقی مثل زبان: نت‌ها مثل حروف، ریتم مثل ضرب‌آهنگ.\" loading=\"lazy\" onerror=\"this.classList.add('x')\"></div><figcaption><span class=\"ref\">تصویر شماره ۱</span> ـ موسیقی مثل زبان: نت‌ها مثل حروف، ریتم مثل ضرب‌آهنگ.</figcaption></figure>\n<p class=\"tech\"><span class=\"tnum\">مفهوم ۱</span>سه عنصر اصلی</p>\n<ul><li>ملودی: دنباله‌ی صداها با زیر و بم متفاوت</li><li>ریتم: زمان‌بندی صداها (کوتاه و بلند)</li><li>هارمونی: صداهایی که هم‌زمان پخش می‌شوند (آکورد)</li></ul>\n<p class=\"tech\"><span class=\"tnum\">مفهوم ۲</span>صدا و ویژگی‌هایش</p>\n<ul><li>زیر و بم (Pitch): فرکانس صدا؛ نت‌ها آن را نشان می‌دهند.</li><li>بلندی (Dynamics): کم یا زیاد بودن شدت صدا</li><li>رنگ صدا (Timbre): فرق صدای ویولن با فلوت</li><li>مدت (Duration): چقدر طول می‌کشد</li></ul><p>در بخش «موسیقی هم یک زبان است» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «موسیقی هم یک زبان است» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «موسیقی هم یک زبان است» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p><strong>گام قابل اجرا:</strong> راهکار «ضبط کن و با معیار بازشنوی کن» را در یک موقعیت ساده امتحان کن. پیش از شروع، پیش‌بینی کوتاهی بنویس؛ بعد از انجام، آنچه واقعاً دیدی ثبت کن. اگر با فرد دیگری درگیر هستی، برداشتت را به‌عنوان یک برداشت مطرح کن و اجازه بده اطلاعات تازه آن را اصلاح کند. یک روش ممکن است در یک وضعیت خوب جواب بدهد و در وضعیتی دیگر نیاز به تغییر داشته باشد؛ بنابراین قانون را بی‌انعطاف اجرا نکن. هدف انتخاب سنجیده‌تر است، نه پیروی مکانیکی از یک دستور.</p>"},{"h":"گوش اول، نت بعد: تمرین شنیدن","b":"<p class=\"an\"><b>تشبیه ساده:</b> یادگرفتن موسیقی مثل یادگرفتن زبان مادری است؛ اول می‌شنویم و تقلید می‌کنیم و بعد نوشتن را یاد می‌گیریم.</p><div class=\"dlg\"><p><b>معلم:</b> ترانه‌ی ساده‌ای که بلدی را زمزمه کن.</p><p><b>سارا:</b> خجالت می‌کشم.</p><p><b>معلم:</b> اشکالی ندارد؛ فقط برای خودت.</p></div><p class=\"tech\"><span class=\"tnum\">تکنیک ۱</span>دو نت</p><p>دو صدا را بشنو و بگو کدام بالاتر است. بعد با صدای خودت بخوان.</p><p class=\"tech\"><span class=\"tnum\">تکنیک ۲</span>بلند و کوتاه</p><p>چند ضرب کوتاه و بلند را کف بزن و تکرار کن.</p><p class=\"tech\"><span class=\"tnum\">تکنیک ۳</span>یک ترانه</p><p>ترانه‌ای ساده را زمزمه کن و ببین کجا صدا بالا یا پایین می‌رود.</p><figure class=\"fr\"><div class=\"frame\"><span class=\"ph\"><i>🖼</i>تصویر تکمیلی ۱</span><img src=\"exam-pics/34-music-theory-img10-ear-training.jpg\" alt=\"تصویر تکمیلی ۱ ـ تمرین گوش.\" loading=\"lazy\" onerror=\"this.classList.add('x')\"></div><figcaption><span class=\"ref\">تصویر تکمیلی ۱</span> ـ تمرین گوش.</figcaption></figure><p>در بخش «گوش اول، نت بعد: تمرین شنیدن» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p><strong>تمرین سنجش‌پذیر:</strong> یک مورد مربوط به «گوش اول، نت بعد: تمرین شنیدن» از درس، خانه، کار گروهی یا استفاده از ابزارها انتخاب کن. ابتدا در دو جمله وضعیت را توصیف کن، سپس اقدام مورد نظرت را بنویس و برای نتیجه یک معیار تعیین کن. این سؤال را پاسخ بده: آیا تئوری را به صدای واقعی وصل می‌کنی؟. اگر نمی‌توانی جواب روشنی بدهی، اطلاعات بیشتری لازم داری یا معیار را درست انتخاب نکرده‌ای. تمرین وقتی کامل است که بتوانی نتیجه را با جمله‌های خودت شرح بدهی و بگویی بار بعد کدام قسمت را تغییر می‌دهی.</p><p><strong>نمونه‌ی کاربردی:</strong> با ضرب دست آغاز هر میزان را پیدا می‌کنی. آن را قدم‌به‌قدم تحلیل کن: چه چیزی واقعاً اتفاق افتاده؟ چه چیزی را فقط حدس می‌زنی؟ چه گزینه‌هایی داری؟ و چه کاری می‌توانی در مقیاس کوچک امتحان کنی؟ پس از اجرا نتیجه را ثبت کن و با انتظار اولیه مقایسه کن. اگر تفاوت وجود داشت، به‌جای پنهان‌کردن آن، از خودت بپرس کدام فرض یا مرحله نیازمند اصلاح است. نگاه مرحله‌ای کمک می‌کند تجربه‌ی روزمره به مهارتی تبدیل شود که دفعه‌ی بعد هم بتوانی از آن استفاده کنی.</p>"},{"h":"نت‌ها و خط حامل","b":"<p class=\"tech\"><span class=\"tnum\">تکنیک ۱</span>خط حامل (Staff)</p>\n<p>پنج خط افقی و چهار فاصله بین آن‌ها؛ نت‌ها روی خط یا در فاصله می‌نشینند. هرچه نت بالاتر باشد، صدا زیرتر است. خط‌ها و فاصله‌ها از پایین به بالا شمرده می‌شوند.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۲</span>نام نت‌ها</p>\n<p>هفت نام تکرارشونده: دو، ر، می، فا، سل، لا، سی (به انگلیسی C، D، E، F، G، A، B). بعد از «سی»، دوباره «دو» می‌آید، یک اکتاو بالاتر. اکتاو یعنی فاصله‌ی بین دو نت با یک نام؛ دو در اکتاو بالاتر فرکانسش دو برابر است. <span class=\"ref\">تصویر شماره ۲</span> را ببینید.</p>\n<figure class=\"fr\"><div class=\"frame\"><span class=\"ph\"><i>🖼</i>تصویر شماره ۲</span><img src=\"exam-pics/34-music-theory-img02-staff.jpg\" alt=\"تصویر شماره ۲ ـ خط حامل با نت‌های دو تا سی.\" loading=\"lazy\" onerror=\"this.classList.add('x')\"></div><figcaption><span class=\"ref\">تصویر شماره ۲</span> ـ خط حامل با نت‌های دو تا سی.</figcaption></figure>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۳</span>کلیدها</p>\n<p>کلید (Clef) نشان می‌دهد هر خط چه نتی است. کلید سل (Treble) برای صدای زیر (دست راست پیانو، ویولن، فلوت) و کلید فا (Bass) برای صدای بم (دست چپ پیانو، ویولنسل). در کلید سل، خط دوم از پایین نت «سل» است؛ از آن‌جا نت‌ها را می‌شناسید.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۴</span>خطوط کمکی</p>\n<p>نت‌هایی که بالاتر یا پایین‌تر از خط حامل‌اند، روی خطوط کوچک اضافی (Ledger Lines) نوشته می‌شوند.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۵</span>علامت‌های تغییر</p>\n<ul><li>دیز (♯): نت را نیم‌پرده بالا می‌برد.</li><li>بمل (♭): نت را نیم‌پرده پایین می‌آورد.</li><li>بکار (♮): تغییر را لغو می‌کند.</li></ul>\n<p>کوچک‌ترین فاصله در موسیقی غربی «نیم‌پرده» است؛ از یک کلید پیانو تا کلید مجاورش (سیاه یا سفید). دو نیم‌پرده یک «پرده» است.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۶</span>کیبورد پیانو</p>\n<p>کلیدهای سفید نت‌های اصلی‌اند؛ کلیدهای سیاه دیز و بمل. بین «می» و «فا» و بین «سی» و «دو» کلید سیاه نیست، چون فاصله‌ی آن‌ها نیم‌پرده است. این الگو را بشناسید و روی هر کیبورد «دو» را پیدا کنید: سمت چپ گروه دو کلید سیاه. <span class=\"ref\">تصویر شماره ۳</span> را ببینید.</p>\n<figure class=\"fr\"><div class=\"frame\"><span class=\"ph\"><i>🖼</i>تصویر شماره ۳</span><img src=\"exam-pics/34-music-theory-img03-piano.jpg\" alt=\"تصویر شماره ۳ ـ کلیدهای سفید و سیاه پیانو و محل نت دو.\" loading=\"lazy\" onerror=\"this.classList.add('x')\"></div><figcaption><span class=\"ref\">تصویر شماره ۳</span> ـ کلیدهای سفید و سیاه پیانو و محل نت دو.</figcaption></figure><p>در بخش «نت‌ها و خط حامل» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «نت‌ها و خط حامل» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «نت‌ها و خط حامل» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده  نت قبلی ساخته می‌شود. <span class=\"ref\">تصویر شماره ۴</span> را ببینید.</p>\n<figure class=\"fr\"><div class=\"frame\"><span class=\"ph\"><i>🖼</i>تصویر شماره ۴</span><img src=\"exam-pics/34-music-theory-img04-values.jpg\" alt=\"تصویر شماره ۴ ـ ارزش نت‌ها: گرد، سفید، سیاه، چنگ و دولاچنگ.\" loading=\"lazy\" onerror=\"this.classList.add('x')\"></div><figcaption><span class=\"ref\">تصویر شماره ۴</span> ـ ارزش نت‌ها: گرد، سفید، سیاه، چنگ و دولاچنگ.</figcaption></figure>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۲</span>سکوت‌ها</p>\n<p>برای هر نت یک سکوت هم‌ارز وجود دارد: سکوت گرد، سفید، سیاه و ... هنگام خواندن، سکوت را هم مثل نت «بشمارید».</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۳</span>میزان و خط میزان</p>\n<p>موسیقی به بخش‌های مساوی به نام «میزان» (Measure) تقسیم می‌شود که با خطوط عمودی نشان داده می‌شوند. هر میزان تعداد مشخصی ضرب دارد.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۴</span>کسر میزان (Time Signature)</p>\n<ul><li><span class=\"mx\" dir=\"ltr\">۴/۴</span>: چهار ضرب سیاه در هر میزان (رایج‌ترین)</li><li><span class=\"mx\" dir=\"ltr\">۳/۴</span>: سه ضرب (والس)</li><li><span class=\"mx\" dir=\"ltr\">۲/۴</span>: دو ضرب (مارش)</li><li><span class=\"mx\" dir=\"ltr\">۶/۸</span>: شش نت چنگ در دو گروه سه‌تایی</li></ul>\n<p>عدد بالا تعداد ضرب‌ها، عدد پایین ارزش نت ضرب (۴ یعنی سیاه) را می‌گوید.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۵</span>نقطه و لیگاتور</p>\n<ul><li>نقطه کنار نت: نصف ارزش نت را اضافه می‌کند (سفید نقطه‌دار = ۳ ضرب).</li><li>لیگاتور (قوس): دو نت هم‌صدا را به هم وصل می‌کند و مدت را جمع می‌کند.</li></ul>\n<p class=\"tech\"><span class=\"tnum\">تمرین</span>ریتم با دست</p>\n<p>با دست‌زدن: سیاه، سیاه، سیاه، سیاه (چهار ضرب). بعد: سیاه، سیاه، چنگ‌چنگ، سیاه. زمان مشخص نگه دارید با ضرب پا. آهسته شروع کنید.</p><p>در بخش «ریتم و ضرب‌آهنگ» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «ریتم و ضرب‌آهنگ» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «ریتم و ضرب‌آهنگ» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «ریتم و ضرب‌آهنگ» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p><strong>گام قابل اجرا:</strong> راهکار «نت را بخوان و سپس اجرا کن» را در یک موقعیت ساده امتحان کن. پیش از شروع، پیش‌بینی کوتاهی بنویس؛ بعد از انجام، آنچه واقعاً دیدی ثبت کن. اگر با فرد دیگری درگیر هستی، برداشتت را به‌عنوان یک برداشت مطرح کن و اجازه بده اطلاعات تازه آن را اصلاح کند. یک روش ممکن است در یک وضعیت خوب جواب بدهد و در وضعیتی دیگر نیاز به تغییر داشته باشد؛ بنابراین قانون را بی‌انعطاف اجرا نکن. هدف انتخاب سنجیده‌تر است، نه پیروی مکانیکی از یک دستور.</p>"},{"h":"ریتم با کف‌زدن: ضرب‌های سه‌چهارم و شش‌هشتم","b":"<p class=\"an\"><b>تشبیه ساده:</b> ضرب مثل ضربان قلب موسیقی است.</p><div class=\"dlg\"><p><b>معلم:</b> والس را شنیده‌ای؟</p><p><b>آرین:</b> بله، یک-دو-سه، یک-دو-سه.</p><p><b>معلم:</b> درست؛ این وزن <span class=\"mx\" dir=\"ltr\">۳/۴</span> است.</p></div><p class=\"tech\"><span class=\"tnum\">تکنیک ۱</span>وزن <span class=\"mx\" dir=\"ltr\">۳/۴</span></p><p>سه ضرب در هر میزان؛ ضرب اول قوی‌تر. مثل «یک-دو-سه».</p><p class=\"tech\"><span class=\"tnum\">تکنیک ۲</span>وزن <span class=\"mx\" dir=\"ltr\">۶/۸</span></p><p>شش ضرب که به دو گروه سه‌تایی تقسیم می‌شود: «یک‌دو‌سه، چهار‌پنج‌شش».</p><p class=\"tech\"><span class=\"tnum\">تکنیک ۳</span>تمرین</p><p>با پا ضرب بگیر و با دست ریتم را کف بزن.</p><p>در بخش «ریتم با کف‌زدن: ضرب‌های سه‌چهارم و شش‌هشتم» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p><strong>نمونه‌ی کاربردی:</strong> با ضرب دست آغاز هر میزان را پیدا می‌کنی. آن را قدم‌به‌قدم تحلیل کن: چه چیزی واقعاً اتفاق افتاده؟ چه چیزی را فقط حدس می‌زنی؟ چه گزینه‌هایی داری؟ و چه کاری می‌توانی در مقیاس کوچک امتحان کنی؟ پس از اجرا نتیجه را ثبت کن و با انتظار اولیه مقایسه کن. اگر تفاوت وجود داشت، به‌جای پنهان‌کردن آن، از خودت بپرس کدام فرض یا مرحله نیازمند اصلاح است. نگاه مرحله‌ای کمک می‌کند تجربه‌ی روزمره به مهارتی تبدیل شود که دفعه‌ی بعد هم بتوانی از آن استفاده کنی.</p>"},{"h":"گام‌ها","b":"<p>گام (Scale) دنباله‌ای از نت‌هاست که از یک نت شروع می‌شود و به همان نت در اکتاو بالاتر می‌رسد. گام‌ها «کلید» و «حال‌وهوا»ی آهنگ را مشخص می‌کنند.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۱</span>گام ماژور</p>\n<p>الگوی فاصله‌ها: پرده، پرده، نیم‌پرده، پرده، پرده، پرده، نیم‌پرده (به انگلیسی W W H W W W H). از «دو» شروع کنید: دو ر می فا سل لا سی دو؛ روی پیانو فقط کلیدهای سفید. بسیاری از آهنگ‌های شاد از گام ماژور استفاده می‌کنند. <span class=\"ref\">تصویر شماره ۵</span> را ببینید.</p>\n<figure class=\"fr\"><div class=\"frame\"><span class=\"ph\"><i>🖼</i>تصویر شماره ۵</span><img src=\"exam-pics/34-music-theory-img05-scale.jpg\" alt=\"تصویر شماره ۵ ـ گام دو ماژور: دو ر می فا سل لا سی دو.\" loading=\"lazy\" onerror=\"this.classList.add('x')\"></div><figcaption><span class=\"ref\">تصویر شماره ۵</span> ـ گام دو ماژور: دو ر می فا سل لا سی دو.</figcaption></figure>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۲</span>گام مینور</p>\n<p>گام مینور طبیعی: پرده، نیم‌پرده، پرده، پرده، نیم‌پرده، پرده، پرده. از «لا» روی کلیدهای سفید: لا سی دو ر می فا سل لا. حالتی غم‌انگیزتر یا جدی‌تر دارد.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۳</span>گام‌های دیگر با دیز یا بمل</p>\n<p>اگر گام ماژور را از نتی غیر از «دو» شروع کنید، برای حفظ الگو لازم است دیز یا بمل بگذارید. مثلاً گام «سل ماژور» یک دیز دارد (فادیز). در ابتدای خط حامل علامت‌های دیز یا بمل نوشته می‌شود (آرمور) تا کل قطعه از آن‌ها استفاده کند.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۴</span>فاصله‌ها (Intervals)</p>\n<ul><li>دوم: نت بعدی (دو ← ر)</li><li>سوم: دو نت با یک نت بین‌شان (دو ← می)</li><li>چهارم (دو ← فا)</li><li>پنجم (دو ← سل)</li><li>هشتم: اکتاو</li></ul>\n<p>سوم ماژور حالت شاد دارد و سوم مینور غمگین‌تر. گوش‌دادن به فاصله‌ها به شما کمک می‌کند آهنگ را بدون نت بنوازید.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۵</span>تمرین گوشی</p>\n<p>هر روز یک گام ماژور را آهسته بنوازید یا بخوانید. بعد با چشم بسته فاصله‌ها را حدس بزنید.</p><p>در بخش «گام‌ها» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p><strong>خطای پرتکرار:</strong> برای شنیدن جزئیات صدا را بیش از حد بلند می‌کنی. راه اصلاح این نیست که خودت را سرزنش کنی؛ باید لحظه‌ای را پیدا کنی که خطا شروع شده و یک راه جایگزین برای همان نقطه تعریف کنی. می‌توانی معیارها را روی کاغذ بنویسی، از منبع یا فرد قابل اعتماد بازخورد بگیری، یا قبل از تصمیم نهایی یک بررسی کوتاه انجام بدهی. برای شروع، فقط یک خطا را انتخاب کن؛ اصلاح چند عادت به‌صورت هم‌زمان تشخیص علت را سخت می‌کند. پس از تمرین دوباره بررسی کن که آیا خطا کمتر شده یا فقط شکلش عوض شده است.</p><p>در بخش «گام‌ها» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «گام‌ها» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل ب lass=\"fr\"><div class=\"frame\"><span class=\"ph\"><i>🖼</i>تصویر شماره ۶</span><img src=\"exam-pics/34-music-theory-img06-chord.jpg\" alt=\"تصویر شماره ۶ ـ سه آکورد اصلی دو ماژور: دو، فا و سل.\" loading=\"lazy\" onerror=\"this.classList.add('x')\"></div><figcaption><span class=\"ref\">تصویر شماره ۶</span> ـ سه آکورد اصلی دو ماژور: دو، فا و سل.</figcaption></figure>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۵</span>معکوس‌ها</p>\n<p>همان آکورد را می‌شود با ترتیب نت‌ها جابه‌جا نواخت (مثلاً می – سل – دو) که «معکوس» نامیده می‌شود. صدای نرم‌تری در جابه‌جایی آکورد‌ها می‌دهد.</p><p>در بخش «آکوردهای ساده» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «آکوردهای ساده» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «آکوردهای ساده» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p><strong>گام قابل اجرا:</strong> راهکار «آکورد را به نت‌هایش بشکن» را در یک موقعیت ساده امتحان کن. پیش از شروع، پیش‌بینی کوتاهی بنویس؛ بعد از انجام، آنچه واقعاً دیدی ثبت کن. اگر با فرد دیگری درگیر هستی، برداشتت را به‌عنوان یک برداشت مطرح کن و اجازه بده اطلاعات تازه آن را اصلاح کند. یک روش ممکن است در یک وضعیت خوب جواب بدهد و در وضعیتی دیگر نیاز به تغییر داشته باشد؛ بنابراین قانون را بی‌انعطاف اجرا نکن. هدف انتخاب سنجیده‌تر است، نه پیروی مکانیکی از یک دستور.</p>"},{"h":"پیشروی آکورد: دو، فا، سل، دو","b":"<p class=\"an\"><b>تشبیه ساده:</b> آکوردها مثل جمله‌هایی‌اند که با هم داستان می‌سازند.</p><div class=\"dlg\"><p><b>معلم:</b> بسیاری از ترانه‌های ساده با سه آکورد ساخته شده‌اند.</p><p><b>رها:</b> کدام‌ها؟</p><p><b>معلم:</b> در گام دو ماژور، آکوردهای دو، فا و سل.</p></div><p class=\"tech\"><span class=\"tnum\">تکنیک ۱</span>سه آکورد اصلی</p><p>دو (دو–می–سل)، فا (فا–لا–دو) و سل (سل–سی–ر).</p><p class=\"tech\"><span class=\"tnum\">تکنیک ۲</span>پیشروی رایج</p><p>دو ← فا ← سل ← دو. شروع، حرکت، تنش و بازگشت آرام.</p><p class=\"tech\"><span class=\"tnum\">تکنیک ۳</span>تمرین</p><p>روی پیانو یا اپ پیانو چهار آکورد را بزن و ببین کدام تنش و کدام آرامش می‌دهد.</p><p>در بخش «پیشروی آکورد: دو، فا، سل، دو» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p><strong>نمونه‌ی کاربردی:</strong> نت‌های حامل را با کلید مربوط می‌خوانی. آن را قدم‌به‌قدم تحلیل کن: چه چیزی واقعاً اتفاق افتاده؟ چه چیزی را فقط حدس می‌زنی؟ چه گزینه‌هایی داری؟ و چه کاری می‌توانی در مقیاس کوچک امتحان کنی؟ پس از اجرا نتیجه را ثبت کن و با انتظار اولیه مقایسه کن. اگر تفاوت وجود داشت، به‌جای پنهان‌کردن آن، از خودت بپرس کدام فرض یا مرحله نیازمند اصلاح است. نگاه مرحله‌ای کمک می‌کند تجربه‌ی روزمره به مهارتی تبدیل شود که دفعه‌ی بعد هم بتوانی از آن استفاده کنی.</p>"},{"h":"دینامیک، سرعت و علائم","b":"<p class=\"tech\"><span class=\"tnum\">تکنیک ۱</span>دینامیک</p>\n<ul><li>pp (پیانیسیمو): خیلی آرام</li><li>p (پیانو): آرام</li><li>mp: نسبتاً آرام</li><li>mf: نسبتاً بلند</li><li>f (فورته): بلند</li><li>ff: خیلی بلند</li></ul>\n<p>«کرشندو» (<) یعنی کم‌کم بلندتر و «دیمینوئندو» یا «دیکرشندو» (>) یعنی کم‌کم آرام‌تر.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۲</span>سرعت (Tempo)</p>\n<p>سرعت را با ضرب در دقیقه (BPM) نشان می‌دهند؛ مثلاً ۶۰ BPM یعنی یک ضرب در ثانیه. اصطلاحات ایتالیایی رایج:</p>\n<ul><li>لارگو (Largo): خیلی آرام (حدود ۴۰–۶۰)</li><li>آداجیو (Adagio): آرام (حدود ۶۶–۷۶)</li><li>آندانته (Andante): با قدم‌های متوسط (حدود ۷۶–۱۰۸)</li><li>مودراتو (Moderato): متوسط (حدود ۱۰۸–۱۲۰)</li><li>آلگرو (Allegro): تند و شاد (حدود ۱۲۰–۱۵۶)</li><li>پرستو (Presto): خیلی تند (حدود ۱۶۸–۲۰۰)</li></ul>\n<p>عددها تقریبی‌اند و منابع مختلف کمی فرق دارند. برای تمرین، از «مترونوم» (ضربه‌ساز) گوشی استفاده کنید. <span class=\"ref\">تصویر شماره ۷</span> را ببینید.</p>\n<figure class=\"fr\"><div class=\"frame\"><span class=\"ph\"><i>🖼</i>تصویر شماره ۷</span><img src=\"exam-pics/34-music-theory-img07-tempo.jpg\" alt=\"تصویر شماره ۷ ـ سرعت و دینامیک در موسیقی.\" loading=\"lazy\" onerror=\"this.classList.add('x')\"></div><figcaption><span class=\"ref\">تصویر شماره ۷</span> ـ سرعت و دینامیک در موسیقی.</figcaption></figure>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۳</span>علائم بیان</p>\n<ul><li>لگاتو: نت‌ها را پیوسته بنوازید.</li><li>استاکاتو (نقطه زیر یا بالای نت): کوتاه و جدا.</li><li>فرمات (نقطه با قوس): نت را بیشتر نگه دارید.</li><li>تکرار (نقطه‌ها کنار خط): قسمت را دوباره بنوازید.</li></ul>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۴</span>علائم پایان</p>\n<p>خط دوتایی ضخیم در پایان قطعه است. «D.C.» یعنی از ابتدا تکرار و «Fine» یعنی پایان.</p><p>در بخش «دینامیک، سرعت و علائم» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «دینامیک، سرعت و علائم» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «دینامیک، سرعت و علائم» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p><strong>نمونه‌ی کاربردی:</strong> با ضرب دست آغاز هر میزان را پیدا می‌کنی. آن را قدم‌به‌قدم تحلیل کن: چه چیزی واقعاً اتفاق افتاده؟ چه چیزی را فقط حدس می‌زنی؟ چه گزینه‌هایی داری؟ و چه کاری می‌توانی در مقیاس کوچک امتحان کنی؟ پس از اجرا نتیجه را ثبت کن و با انتظار اولیه مقایسه کن. اگر تفاوت وجود داشت، به‌جای پنهان‌کردن آن، از خودت بپرس کدام فرض یا مرحله نیازمند اصلاح است. نگاه مرحله‌ای کمک می‌کند تجربه‌ی روزمره به مهارتی تبدیل شود که دفعه‌ی بعد هم بتوانی از آن استفاده کنی.</p>"},{"h":"خواندن یک قطعه‌ی ساده","b":"<p>حالا که اجزا را می‌شناسید، یک ملودی ساده را بخوانیم. ملودی «سرود شادی» از بتهوون (قطعه‌ی عمومی و قدیمی) را در گام دو ماژور در نظر بگیرید.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۱</span>نت‌های بخش اول</p>\n<p>می می فا سل | سل فا می ر | دو دو ر می | می ر ر. هر چهار نت اول یک میزان (کسر <span class=\"mx\" dir=\"ltr\">۴/۴</span> با نت‌های سیاه) هستند. آخرین نت میزان سوم کمی طولانی‌تر است (سیاه‌نقطه‌دار) و بعد یک چنگ می‌آید (می ر ر). با دست پای ضرب بگیرید و همین‌طور بخوانید: «می می فا سل، سل فا می ر، دو دو ر می، می (کشیده) ر ر». <span class=\"ref\">تصویر شماره ۸</span> را ببینید.</p>\n<figure class=\"fr\"><div class=\"frame\"><span class=\"ph\"><i>🖼</i>تصویر شماره ۸</span><img src=\"exam-pics/34-music-theory-img08-ode.jpg\" alt=\"تصویر شماره ۸ ـ نت‌های ملودی ساده در گام دو ماژور.\" loading=\"lazy\" onerror=\"this.classList.add('x')\"></div><figcaption><span class=\"ref\">تصویر شماره ۸</span> ـ نت‌های ملودی ساده در گام دو ماژور.</figcaption></figure>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۲</span>روش مرحله‌ای برای خواندن قطعه</p>\n<ol><li>کسر میزان و آرمور (دیز یا بمل) را ببینید.</li><li>سرعت و دینامیک را بخوانید.</li><li>ریتم را بدون نت بخوانید: «تا، تا، تا، تا».</li><li>نت‌ها را با اسم بخوانید.</li><li>هر دو را با هم بنوازید یا بخوانید.</li><li>آهسته شروع کنید و با مترونوم تند کنید.</li></ol>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۳</span>گام کوچک</p>\n<p>قطعه را میزان‌به‌میزان یاد بگیرید. اگر در یک میزان گیر کردید، همان‌جا ده بار آهسته تکرار کنید و بعد به قبل و بعد وصلش کنید.</p>\n<p class=\"tech\"><span class=\"tnum\">تکنیک ۴</span>چگونه تمرین کنیم</p>\n<ul><li>روزی ۱۰ تا ۲۰ دقیقه بهتر از یک بار هفته‌ای ۲ ساعت</li><li>آهسته، درست و بعد سریع</li><li>تکرار با تمرکز، نه تکرار بی‌حوصله</li><li>ضبط خود و گوش‌دادن</li><li>نواختن با آدم‌های دیگر</li></ul><p>در بخش «خواندن یک قطعه‌ی ساده» بهتر است موضوع را تجربه‌ی روزمره به مهارتی تبدیل شود که دفعه‌ی بعد هم بتوانی از آن استفاده کنی.</p>"},{"h":"سلامت شنوایی و ابزارهای تمرین","b":"<p class=\"an\"><b>تشبیه ساده:</b> گوش مثل شمعی است که اگر زیاد در باد بماند، زود تمام می‌شود؛ مراقبش باش.</p><p class=\"tech\"><span class=\"tnum\">تکنیک ۱</span>قاعده‌ی ۶۰ و ۶۰</p><p>حداکثر ۶۰ درصد صدا و حداکثر ۶۰ دقیقه پشت سر هم با هدفون.</p><p class=\"tech\"><span class=\"tnum\">تکنیک ۲</span>ابزارها</p><p>اپ‌های پیانو و مترونوم، و تمرین روزانه ده دقیقه‌ای. استمرار از طول تمرین مهم‌تر است.</p><p class=\"tech\"><span class=\"tnum\">تکنیک ۳</span>سازهای ایرانی</p><p>تار، سه‌تار، سنتور، نی، کمانچه و تنبک. به هر کدام گوش بده و تفاوت صدایشان را توصیف کن.</p><p class=\"tech\"><span class=\"tnum\">تکنیک ۴</span>ربع‌پرده</p><p>در دستگاه‌های موسیقی ایرانی علاوه بر نیم‌پرده، فاصله‌های کوچک‌تر هم هست: «کُرن» و «سُری». برای شنیدن این تفاوت باید زیاد گوش داد و تقلید کرد.</p><p>در بخش «سلامت شنوایی و ابزارهای تمرین» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «سلامت شنوایی و ابزارهای تمرین» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p><strong>نمونه‌ی کاربردی:</strong> با ضرب دست آغاز نهان‌کردن آن، از خودت بپرس کدام فرض یا مرحله نیازمند اصلاح است. نگاه مرحله‌ای کمک می‌کند تجربه‌ی روزمره به مهارتی تبدیل شود که دفعه‌ی بعد هم بتوانی از آن استفاده کنی.</p>"},{"h":"نگاهی به موسیقی ایرانی، ابزارها و ادامه‌ی مسیر","b":"<p class=\"tech\"><span class=\"tnum\">مفهوم ۱</span>موسیقی ایرانی و نیم‌پرده‌های دیگر</p>\n<p>موسیقی دستگاهی ایران بر مبنای «دستگاه‌ها» و «گوشه‌ها» است. علاوه بر دیز و بمل، دو علامت دیگر دارد: «کُرن» (نیم‌بمل، کاهش حدود ربع‌پرده) و «سُری» (نیم‌دیز، افزایش حدود ربع‌پرده). این فاصله‌ها در موسیقی ایرانی رنگ خاصی ایجاد می‌کنند و در پیانو (که برای نیم‌پرده ساخته شده) به‌سادگی نواخته نمی‌شوند. سازهایی مثل تار، سه‌تار، سنتور، نی و کمانچه برای این منظور مناسب‌اند. اگر موسیقی ایرانی می‌خواهید، دنبال استاد یا آموزشگاه معتبر باشید.</p>\n<p class=\"tech\"><span class=\"tnum\">مفهوم ۲</span>انتخاب ساز</p>\n<ul><li>پیانو یا کیبورد: برای یادگیری نت و هارمونی عالی</li><li>گیتار: آکورد و همراهی با آواز</li><li>فلوت (ریکوردر): ارزان و مناسب شروع ملودی</li><li>سازهای ایرانی (تار، سنتور، نی): برای موسیقی ایرانی</li></ul>\n<p class=\"tech\"><span class=\"tnum\">مفهوم ۳</span>برنامه‌ها و منابع</p>\n<p>برنامه‌های آموزش پیانو، گوش‌پروری و مترونوم کمک می‌کنند. ولی با یک معلم، حتی دو بار در ماه، اشتباه‌های تکنیکی اصلاح می‌شود. از گوش‌دادن غافل نشوید؛ هر آهنگی را که دوست دارید، سعی کنید گام و آکوردهایش را تشخیص دهید.</p>\n<p class=\"tech\"><span class=\"tnum\">مفهوم ۴</span>هوش مصنوعی و موسیقی</p>\n<p>ابزارهای هوش مصنوعی می‌توانند آهنگ بسازند یا نت‌نویسی کنند، ولی نمی‌توانند جای تمرین و گوش شما را بگیرند. اگر آهنگی را با ابزار می‌سازید، شرایط حق نشر را بخوانید (درس ۲۳) و نوشتن ایده‌ی خودتان را اول انجام دهید.</p>\n<p class=\"tech\"><span class=\"tnum\">تمرین ۱</span>گام و آکورد با یک ساز</p>\n<ol><li>گام دو ماژور را در دو اکتاو بنوازید.</li><li>سه آکورد دو، فا و سل ماژور را یاد بگیرید.</li><li>«سرود شادی» را با یک انگشت بنوازید.</li><li>ضرب را با مترونوم ۷۲ BPM نگه دارید.</li></ol>\n<p class=\"tech\"><span class=\"tnum\">تمرین ۲</span>آهنگ خودتان</p>\n<p>با چهار میزان در <span class=\"mx\" dir=\"ltr\">۴/۴</span> و آکوردهای دو – سل – لا مینور – فا، یک ملودی ساده بسازید. نت‌ها را بنویسید یا ضبط کنید. این اولین آهنگ شماست.</p>\n<figure class=\"fr\"><div class=\"frame\"><span class=\"ph\"><i>🖼</i>تصویر شماره ۹</span><img src=\"exam-pics/34-music-theory-img09-pract.jpg\" alt=\"تصویر شماره ۹ ـ تمرین پیانو و نوشتن آهنگ اول.\" loading=\"lazy\" onerror=\"this.classList.add('x')\"></div><figcaption><span class=\"ref\">تصویر شماره ۹</span> ـ تمرین پیانو و نوشتن آهنگ اول.</figcaption></figure>\n<p class=\"tech\"><span class=\"tnum\">آزمون</span>پنج سؤال تشخیصی</p>\n<details><summary>1) در گام ماژور فاصله‌ی نت‌ها چیست؟</summary><p>پرده، پرده، نیم‌پرده، پرده، پرده، پرده، نیم‌پرده.</p></details><details><summary>2) نت سیاه چند ضرب است؟</summary><p>یک ضرب در کسر میزان <span class=\"mx\" dir=\"ltr\">۴/۴</span>.</p></details><details><summary>3) دیز و بمل چه می‌کنند؟</summary><p>دیز نت را نیم‌پرده بالا می‌برد و بمل نیم‌پرده پایین می‌آورد.</p></details><details><summary>4) سه آکورد اصلی در دو ماژور کدام‌اند؟</summary><p>دو ماژور، فا ماژور و سل ماژور (I، IV، V).</p></details><details><summary>5) کُرن و سُری چیست؟</summary><p>علامت‌های موسیقی ایرانی برای کاهش یا افزایش حدود ربع‌پرده.</p></details>\n<p>این آخرین درس مجموعه است. موسیقی مثل خلاقیت و مهارت‌های دیگر این دوره، با تمرین کوچک و منظم رشد می‌کند؛ از امروز یک گام ماژور را در برنامه‌تان بگذارید.</p><p>در بخش «نگاهی به موسیقی ایرانی، ابزارها و ادامه‌ی مسیر» بهتر است موضوع را فقط در حد تعریف نگه نداری. نظریه‌ی موسیقی ارتباط ارتفاع صدا، زمان‌بندی، سازمان نت‌ها و شیوه‌ی بیان اجرایی را روشن می‌کند. برای اینکه این اصل در عمل به کارت بیاید، قبل از اقدام مشخص کن چه چیزی را می‌خواهی بهبود بدهی، چه محدودیتی داری و چه نشانه‌ای می‌گوید مسیر درستی انتخاب کرده‌ای. اگر نتوانی نتیجه را توصیف کنی، هدف هنوز کلی است. یک نشانه‌ی ساده و قابل مشاهده انتخاب کن و پس از اجرا به آن برگرد؛ همین کار به‌جای تکیه بر حس مبهم، یادگیری را قابل بررسی می‌کند.</p><p>در بخش «نگاهی به موسیقی ایرانی، ابزارها و ادامه‌ی مسیر» بهتر   a.addEventListener('loadedmetadata',()=>{if(saved>1&&a.duration&&saved<a.duration-5){try{a.currentTime=saved;}catch(e){}}syncUI(i);});
  a.addEventListener('timeupdate',()=>{syncUI(i);const n=Date.now();if(n-lastSave>4000){lastSave=n;store.set('last',i+'|'+a.currentTime.toFixed(1));}});
  a.addEventListener('play',()=>{audios.forEach((o,j)=>{if(j!==i&&!o.paused)o.pause();});syncUI(i);});
  a.addEventListener('pause',()=>{store.set('last',i+'|'+a.currentTime.toFixed(1));syncUI(i);});
  a.addEventListener('ended',()=>{store.set('last',i+'|0');try{a.currentTime=0;}catch(e){}syncUI(i);});
  return a;
});
function syncUI(i){const box=document.querySelector('.ap[data-i="'+i+'"]');if(!box)return;const a=audios[i];box.classList.toggle('off',!(a.duration>0));box.querySelector('.pp').innerHTML=a.paused?SVG_PLAY:SVG_PAUSE;const d=a.duration||0,c=a.currentTime||0;box.querySelector('.fill').style.width=(d>0?(c/d*100):0)+'%';box.querySelector('.tm').textContent=faT(c)+' / '+faT(d);box.querySelector('.mu').innerHTML=(a.muted||a.volume===0)?SVG_MUTE:SVG_VOL;const v=box.querySelector('.vol');if(document.activeElement!==v)v.value=a.muted?0:a.volume;}
function apToggle(i){const a=audios[i];if(a.paused){a.play().catch(()=>{});}else{a.pause();}}
function apSeek(i,ev){const a=audios[i];if(!a.duration)return;const bar=ev.currentTarget,r=bar.getBoundingClientRect();let p=(ev.clientX-r.left)/r.width;if(getComputedStyle(bar).direction==='rtl')p=1-p;a.currentTime=Math.min(Math.max(p,0),1)*a.duration;syncUI(i);}
function apVol(i,v){v=parseFloat(v);audios.forEach(a=>{a.volume=v;if(v>0)a.muted=false;});store.set('vol',String(v));store.set('mut',v===0?'1':'0');audios.forEach((_,j)=>syncUI(j));}
function apMute(){const m=!audios[0].muted;audios.forEach(a=>{a.muted=m;});store.set('mut',m?'1':'0');audios.forEach((_,j)=>syncUI(j));}
function playerHTML(i){const vv=store.get('mut','0')==='1'?0:store.get('vol','1');return '<div class="ap off" data-i="'+i+'"><button class="pp" onclick="apToggle('+i+')" aria-label="پخش / مکث">'+SVG_PLAY+'</button><div class="bar" onclick="apSeek('+i+',event)"><div class="fill"></div></div><span class="tm">۰:۰۰ / ۰:۰۰</span><button class="mu" onclick="apMute()" aria-label="بی‌صدا">'+SVG_VOL+'</button><input class="vol" type="range" min="0" max="1" step="0.05" value="'+vv+'" oninput="apVol('+i+',this.value)" aria-label="بلندی صدا"></div>';}
function toggle(i){ open = (open===i) ? null : i; try{ open===null?localStorage.removeItem(KEY):localStorage.setItem(KEY,open) }catch(e){} render(); }
function render(){
  document.getElementById("app").innerHTML = SECTIONS.map((s,i)=>{
    const o = open===i;
    return `<section class="item${o?' open':''}">
      <div class="hd" onclick="toggle(${i})"><span class="num">${i+1}</span><span class="t">${s.h}</span><span class="chev">◂</span></div>
      <div class="body"><div class="inner">${playerHTML(i)}${s.b}</div></div>
    </section>`;
  }).join("");
}
render();
audios.forEach((_,j)=>syncUI(j));
</script>
<script>
(function(){var b=document.getElementById("theme");
function cur(){return document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}
function paint(){b.textContent=cur()==="dark"?"☀":"☾";}
b.onclick=function(){var n=cur()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("amz-theme",n);}catch(e){}paint();};paint();})();
</script>
