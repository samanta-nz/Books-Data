<style>
:root{
  --hue:188;
  --bg:#f4f5fb; --card:#ffffff; --card-b:#e7e8f2; --text:#1b1c26; --muted:#6b7080;
  --accent: hsl(var(--hue) 78% 46%);
  --accent2: hsl(calc(var(--hue) + 40) 85% 55%);
  --glow: hsl(var(--hue) 90% 60%);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d0e14; --card:#171826; --card-b:#262838; --text:#eef0f7; --muted:#9aa0b4;
    --accent: hsl(var(--hue) 85% 62%); --accent2: hsl(calc(var(--hue) + 40) 90% 65%); }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn','Tahoma',sans-serif;
  overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.glow{position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0;pointer-events:none}
.g1{width:260px;height:260px;background:var(--glow);top:-80px;right:-60px}
.g2{width:220px;height:220px;background:var(--accent2);bottom:10%;left:-70px;opacity:.25}
header{position:sticky;top:0;z-index:5;padding:16px 18px calc(14px + env(safe-area-inset-top,0px));
  background:linear-gradient(135deg, hsl(var(--hue) 70% 20%), hsl(calc(var(--hue)+30) 70% 14%));
  color:#fff;box-shadow:0 6px 24px -8px hsl(var(--hue) 70% 30% / .6)}
header .crumb{font-size:11px;opacity:.75;margin-bottom:4px}
header h1{margin:0;font-size:18px;font-weight:800;line-height:1.5}
main{position:relative;z-index:1;padding:14px 14px 40px;max-width:540px;margin:0 auto}
.item{margin-bottom:12px;border-radius:18px;overflow:hidden;background:var(--card);
  border:1px solid var(--card-b);box-shadow:0 4px 18px -10px rgba(0,0,0,.25);transition:box-shadow .25s}
.item.open{box-shadow:0 8px 28px -8px hsl(var(--hue) 70% 40% / .35)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;
  cursor:pointer;user-select:none}
.hd .num{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.hd .t{flex:1;font-size:14.5px;font-weight:700}
.hd .chev{color:var(--accent);font-size:12px;transition:transform .25s ease}
.item.open .chev{transform:rotate(90deg)}
.body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.item.open .body{max-height:12000px}
.inner{padding:0 18px 16px 18px;font-size:13.5px;line-height:2;color:var(--text)}
.inner p{margin:0 0 8px}
.inner ul{margin:6px 0 0;padding-inline-start:20px}
.inner li{margin-bottom:5px;color:var(--muted)}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:11px;padding:6px 0 26px}

header .meta{font-size:11px;opacity:.85;margin-top:4px}
.inner figure{margin:12px 0;padding:10px;border:1px solid var(--card-b);border-radius:14px;background:var(--bg)}
.inner figure img{width:100%;height:auto;border-radius:10px;display:block}
.inner figcaption{font-size:12px;color:var(--muted);line-height:1.9;margin-top:8px;text-align:center}
.inner .ref{color:var(--accent);font-weight:800}

.inner ol{margin:6px 0 0;padding-inline-start:20px}
.inner ol li{margin-bottom:5px;color:var(--muted)}
.inner .tech{font-weight:800;font-size:14px;margin:14px 0 6px;padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--card-b)}
.inner .tnum{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:20px;padding:2px 10px;margin-left:8px}

.ap{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;margin:0 0 10px;border:1px solid var(--card-b);border-radius:999px;background:var(--bg)}
.ap .pp,.ap .mu{flex:none;width:22px;height:22px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ap .pp svg,.ap .mu svg{width:12px;height:12px}
.ap .bar{flex:1;height:4px;border-radius:4px;background:var(--card-b);cursor:pointer;overflow:hidden}
.ap .fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.ap .tm{flex:none;font-size:10px;color:var(--muted);white-space:nowrap;min-width:70px;text-align:center}
.ap .vol{flex:none;width:80px;accent-color:var(--accent);cursor:pointer;padding:0;direction:ltr}

header.heading{position:static;background:none;box-shadow:none;padding:14px 14px 0;color:inherit;max-width:540px;margin:0 auto 15px;display:grid;grid-template-columns:minmax(0,1fr) auto 39px;gap:7px;align-items:center;margin:0 2px 15px}
.heading small{color:var(--accent);font-size:10px}
.heading h1{margin:2px 0;font-size:23px;line-height:1.5}
.heading .en{font-size:10px;color:var(--muted);direction:ltr;text-align:right;letter-spacing:1px}
.heading .meta{font-size:10px;color:var(--muted);margin-top:3px}
.brand{display:flex;justify-content:center;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.3px;color:var(--accent)}
.tag{direction:ltr;font-size:10px;letter-spacing:.5px;background:linear-gradient(135deg,#9becbe,#36a57c);color:#092c20;padding:3px 9px;border-radius:6px;font-weight:800}
.header-brand{flex-direction:column;gap:4px;font-size:14px;line-height:1.45;white-space:nowrap}
.header-brand .tag{font-size:7px;padding:3px 5px}
.theme{background:var(--card);border:1px solid var(--card-b);border-radius:50%;width:39px;height:39px;color:var(--accent);font-size:20px;cursor:pointer}
footer{border-top:1px solid var(--card-b);padding-top:20px;margin-top:25px}
footer p{margin:5px 0}footer .brand{font-size:17px;margin:10px 0}footer strong{font-size:11px;color:var(--text)}
.lesson-nav{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.lnav{font-size:12px;font-weight:800;color:var(--accent);text-decoration:none;border:1px solid var(--card-b);background:var(--card);border-radius:999px;padding:8px 18px}
html[data-theme="light"]{--bg:#f4f5fb;--card:#ffffff;--card-b:#e7e8f2;--text:#1b1c26;--muted:#6b7080;--accent:hsl(188 78% 46%);--accent2:hsl(228 85% 55%);color-scheme:light}
html[data-theme="dark"]{--bg:#0d0e14;--card:#171826;--card-b:#262838;--text:#eef0f7;--muted:#9aa0b4;--accent:hsl(188 85% 62%);--accent2:hsl(228 90% 65%);color-scheme:dark}
#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center}
#loader.done{opacity:0;pointer-events:none;transition:opacity .4s}
.ld-box{position:relative;width:170px;text-align:center}
.ld-box svg{width:170px;height:170px;transform:rotate(-90deg)}
.ld-bg,.ld-fg{fill:none;stroke-width:12}
.ld-bg{stroke:var(--card-b)}.ld-fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377}
.ld-num{position:absolute;top:56px;width:100%;font-size:32px;font-weight:800}
.ld-cap{margin-top:10px;font-size:12px;color:var(--muted)}

.inner figure.fr{padding:8px}
.inner figure .frame{position:relative;width:100%;aspect-ratio:720/392;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--card-b),var(--bg));display:flex;align-items:center;justify-content:center}
.inner figure .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0;z-index:1}
.inner figure .frame img.x{display:none}
.frame .ph{position:relative;z-index:0;text-align:center;font-size:12px;font-weight:800;color:var(--accent);padding:0 14px;line-height:1.9}
.frame .ph i{display:block;font-style:normal;font-size:26px;opacity:.55}
.ap.off{opacity:.45;pointer-events:none}
.inner pre{direction:ltr;text-align:left;overflow-x:auto;background:var(--bg);border:1px solid var(--card-b);border-radius:10px;padding:10px;font-size:12px;line-height:1.7;margin:8px 0}
.inner details{margin:6px 0;border:1px solid var(--card-b);border-radius:10px;padding:8px 12px;background:var(--bg)}
.inner summary{cursor:pointer;font-weight:700;font-size:13px}
.inner details p{margin:8px 0 0;color:var(--muted)}

.inner .dlg{margin:10px 0;padding:10px 14px;border-radius:14px;background:var(--bg);border:1px dashed var(--card-b)}
.inner .dlg p{margin:0 0 6px;line-height:1.95}
.inner .dlg p:last-child{margin-bottom:0}
.inner .dlg b{color:var(--accent);margin-left:4px}
.inner .an{margin:10px 0;padding:10px 14px;border-radius:12px;border-inline-start:4px solid var(--accent);background:var(--bg)}
.inner .mx{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700}
.inner .lk{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px dotted var(--accent)}
</style>

<script>(function(){var C=376.99,p=0,done=false,fg=document.getElementById("ldFg"),nm=document.getElementById("ldNum");
var FA="۰۱۲۳۴۵۶۷۸۹";function fa(n){return String(n).replace(/[0-9]/g,function(d){return FA[d];});}
function set(v){p=v;fg.style.strokeDashoffset=(C-C*v/100).toFixed(1);nm.textContent=fa(Math.round(v))+"٪";}
set(4);var t=setInterval(function(){if(p<90)set(p+Math.max(.3,(90-p)/40));},50);
function fin(){if(done)return;done=true;clearInterval(t);set(100);var L=document.getElementById("loader");L.classList.add("done");setTimeout(function(){L.remove();},450);}
window.addEventListener("load",function(){setTimeout(fin,150)});setTimeout(fin,12000);})();</script>

<script>
const SECTIONS = [{"h":"تایپ ده‌انگشتی چیست و چرا یادش بگیریم؟","b":"<p>تایپ ده‌انگشتی یعنی هر انگشت مسئول گروه مشخصی از کلیدها باشد و برای پیدا کردن حروف مجبور نباشی مدام به صفحه‌کلید نگاه کنی. هدف فقط سریع تایپ‌کردن نیست؛ وقتی جای کلیدها را با حافظه‌ی حرکتی پیدا می‌کنی، توجهت آزادتر می‌شود تا روی فکر، جمله‌بندی و محتوای نوشته تمرکز کنی. برای دانش‌آموز، این مهارت می‌تواند هنگام نوشتن تکلیف، جست‌وجو، برنامه‌نویسی یا ثبت یادداشت دیجیتال وقت ذخیره کند.</p><p>با این حال، سرعت بالا بدون دقت ارزش زیادی ندارد. اگر متن را خیلی تند بنویسی و بعد مجبور شوی اشتباه‌های زیادی را اصلاح کنی، زمان واقعی کار ممکن است بیشتر شود. پس از ابتدا سه معیار را هم‌زمان پیگیری کن: سرعت، دقت و راحتی بدن. یادگیری جای انگشتان ابتدا کند است؛ این طبیعی است و نباید باعث شود به روش قدیمی برگردی و هر بار فقط با دو انگشت بزنی.</p><p>صفحه‌کلیدها ممکن است چیدمان‌های مختلف داشته باشند و جای نشانه‌ها با تغییر زبان فرق کند. بهتر است با همان دستگاه و چیدمانی تمرین کنی که بیشتر استفاده می‌کنی. در کیبوردهای رایج، نشانه‌های برجسته‌ی روی F و J به انگشت اشاره کمک می‌کنند ردیف پایه را بدون نگاه پیدا کند؛ اما ارزش اصلی، شناختن موقعیت فیزیکی و بازگشت منظم انگشتان است.</p><p class=\"tech\"><span class=\"tnum\">تمرین آغازین</span></p><p>یک دقیقه متن ساده تایپ کن، سرعت و تعداد اشتباه‌ها را ثبت کن و هنوز تلاش نکن رکورد بزنی. این عدد فقط خط پایه‌ی توست. پس از چند هفته دوباره همان نوع متن را امتحان کن تا مقایسه منصفانه‌تر باشد.</p><p class=\"tech\"><span class=\"tnum\">سرعت تایپ از کجا می‌آید؟</span></p><p>وقتی برای پیدا کردن هر حرف به صفحه‌کلید نگاه می‌کنی، بخشی از توجهت از جمله‌ای که می‌خواهی بنویسی جدا می‌شود. روش ده‌انگشتی تلاش می‌کند جای کلیدها را به حرکت‌های قابل‌پیش‌بینی تبدیل کند تا ذهن بیشتر روی محتوا بماند. لازم نیست از همان روز اول هر ده انگشت را بی‌نقص به کار ببری یا سرعت بالایی داشته باشی؛ ابتدا حرکت درست و بدون فشار را بساز. این روش برای بیشتر صفحه‌کلیدهای رایج مفید است، اما چیدمان فارسی، انگلیسی، لپ‌تاپ و صفحه‌کلیدهای کوچک ممکن است تفاوت داشته باشد. بنابراین نقشه‌ی واقعی دستگاه خودت را بشناس و تمرین را با همان چیدمان انجام بده. معیار پیشرفت، کاربرد بهتر در نوشتن تکلیف و متن واقعی است، نه فقط رکوردی که در یک بازی تایپ به دست می‌آوری.</p><p class=\"tech\"><span class=\"tnum\">هر مهارت تازه با حرکت درست آغاز می‌شود</span></p><p>در چند جلسه‌ی اول ممکن است تایپ ده‌انگشتی از شیوه‌ی قبلی کندتر به نظر برسد. دلیلش این است که هنوز برای پیدا کردن کلیدها فکر می‌کنی و حرکت‌ها به عادت تبدیل نشده‌اند. اگر هر بار به روش قدیمی برگردی، مغز فرصت کافی برای تثبیت الگوی تازه پیدا نمی‌کند؛ اما اگر بیش از حد فشار بیاوری، احتمال خطا و خستگی بالا می‌رود. یک راه میانه این است که چند دقیقه تمرین مشخص انجام بدهی و سپس تکلیف واقعی را با سرعت راحت تایپ کنی. هنگام تمرین، روی یک هدف تمرکز کن؛ مثلاً برگشت انگشت به جای پایه یا کمتر نگاه‌کردن به کلیدها. وقتی آن هدف کمی پایدار شد، هدف بعدی را اضافه کن. قرار نیست همه‌ی افراد با سرعت یکسان پیشرفت کنند؛ اندازه‌ی دست، نوع صفحه‌کلید، تجربه‌ی قبلی و زبان نوشتن اثر دارند.</p>"},{"h":"آماده‌کردن بدن و صفحه‌کلید","b":"<p>قبل از تمرین، محیط را طوری تنظیم کن که بتوانی راحت و بدون فشار بنشینی. کف پاها روی زمین یا زیرپایی باشد، شانه‌ها رها بمانند و آرنج‌ها نزدیک بدن و تقریباً در زاویه‌ی راحت قرار گیرند. مچ دست را تا جای ممکن در امتداد ساعد نگه دار؛ آن را به بالا یا پایین خم نکن و وزن بدن را روی مچ تکیه نده. صفحه‌کلید باید در فاصله‌ای باشد که لازم نباشد برای رسیدن به آن شانه‌ها را جلو ببری.</p><p>صفحه‌نمایش را در ارتفاع و فاصله‌ای قرار بده که برای دیدن متن سرت را مدت طولانی خم نکنی. هنگام تمرین، نور کافی و اندازه‌ی قلم خوانا داشته باش. قرار نیست وضعیت بدن کاملاً خشک و بی‌حرکت بماند؛ تغییر حالت و استراحت کوتاه لازم است. اگر درد، گزگز یا بی‌حسی تکرار می‌شود، تمرین را متوقف کن و شرایط ارگونومی را بررسی کن و در صورت ماندگاری از متخصص سلامت کمک بگیر.</p><p>کلیدها را با فشار زیاد نزن. صفحه‌کلید معمولاً با نیروی ملایم کار می‌کند؛ ضربه‌ی شدید فقط دست را زودتر خسته می‌کند و صدای بیشتری می‌سازد. انگشت‌ها را نزدیک کلیدها نگه دار و از بالا بردن زیاد دست در هر حرکت پرهیز کن.</p><p class=\"tech\"><span class=\"tnum\">چک‌لیست پیش از شروع</span></p><ul><li>پاها و صندلی در وضعیت راحت‌اند.</li><li>شانه‌ها رها و مچ‌ها مستقیم‌اند.</li><li>صفحه‌کلید و زبان ورودی درست انتخاب شده‌اند.</li><li>برای تمرین کوتاه، زمان‌سنج و متن آماده است.</li></ul><p class=\"tech\"><span class=\"tnum\">تنظیم محل کار و استراحت</span></p><p>صفحه‌کلید را آن‌قدر نزدیک بگذار که برای رسیدن به آن مجبور نباشی شانه‌ها را جلو بکشی. آرنج‌ها نزدیک بدن و شانه‌ها رها باشند؛ مچ را تا جای ممکن در امتداد ساعد نگه دار و روی لبه‌ی تیز میز فشار نده. به صفحه نگاه کن، نه اینکه گردنت را برای دیدن حروف پایین نگه داری. اگر لپ‌تاپ روی میز کوتاه است، وضعیت صفحه و صفحه‌کلید ممکن است سازش لازم داشته باشد؛ راحتی بدن از یک قانون خشک مهم‌تر است. هر چند دقیقه نگاهت را از صفحه بردار، انگشت‌ها را رها کن و کمی حرکت کن. در صورت درد مداوم، گزگز یا بی‌حسی تمرین را متوقف کن و وضعیت کار را اصلاح کن؛ قرار نیست بدن به خاطر افزایش سرعت آسیب ببیند. نور مناسب و اندازه‌ی خوانای متن هم خستگی چشم را کمتر می‌کند.</p><p class=\"tech\"><span class=\"tnum\">تنظیم جزئیات برای راحتی بیشتر</span></p><p>اگر ارتفاع میز مناسب نیست، ممکن است شانه‌ها بالا بمانند یا مچ‌ها بیش از حد خم شوند. تنظیم صندلی، فاصله‌ی صفحه‌کلید و محل نمایشگر را طوری انجام بده که بدن برای رسیدن به ابزار در وضعیت ناراحت قرار نگیرد. مچ را محکم روی میز فشار نده و هنگام تایپ انگشت‌ها را با ضربه‌های لازم و نه با فشار زیاد حرکت بده. هر زمان که دست‌ها خسته شدند، مکث کوتاه کن؛ استراحت بخشی از تمرین خوب است. اگر از لپ‌تاپ استفاده می‌کنی، ممکن است ارتفاع نمایشگر و صفحه‌کلید را نتوانی هم‌زمان ایده‌آل تنظیم کنی؛ اول وضعیت بدن و نبود درد را در اولویت بگذار و تا حد امکان چیدمان را اصلاح کن. درد مداوم، بی‌حسی یا گزگز را نادیده نگیر. در چنین وضعی ادامه‌دادن برای حفظ برنامه‌ی روزانه کار درستی نیست.</p>"},{"h":"ردیف پایه؛ خانه‌ی انگشتان","b":"<p>ردیف پایه نقطه‌ی شروع و بازگشت انگشت‌هاست. در صفحه‌کلید رایج QWERTY، دست چپ روی A، S، D، F و دست راست روی J، K، L و نقطه‌ویرگول قرار می‌گیرد؛ شست‌ها معمولاً برای فاصله استفاده می‌شوند. اگر با چیدمان فارسی کار می‌کنی، برچسب حرف‌های روی کلیدها ممکن است با حالت انگلیسی فرق کند، اما موقعیت فیزیکی کلیدها همان است. در شروع، نشانه‌ی برجسته‌ی F و J کمک می‌کند دست‌ها را بدون نگاه به جای خود برگردانی.</p><p>در تمرین پایه، هر انگشت فقط کلیدهای مسئول خودش را بزند و سپس به نقطه‌ی شروع برگردد. اول دقت کن کدام انگشت حرکت می‌کند و کدام دست بی‌دلیل بلند می‌شود. نگاهت روی متن یا صفحه‌نمایش بماند؛ اگر برای هر کلید به صفحه‌کلید نگاه کنی، حافظه‌ی حرکتی فرصت شکل‌گیری پیدا نمی‌کند. ممکن است چند خط اول کند و پرخطا باشد؛ این مرحله‌ی یادگیری است، نه نشانه‌ی ناتوانی.</p><p>اگر اشتباه کردی، به جای تندترزدن، انگشت مربوط را پیدا کن و همان الگو را آرام تکرار کن. هر بار اشتباه را با ضربه‌های سریع جبران‌کردن می‌تواند الگوی نادرست را تثبیت کند.</p><p class=\"tech\"><span class=\"tnum\">تمرین پایه</span></p><ol><li>دست‌ها را روی ردیف پایه قرار بده و چند ثانیه موقعیت را حس کن.</li><li>کلیدهای مسئول هر انگشت را جداگانه، آهسته و دقیق بزن.</li><li>پس از هر حرکت انگشت را به خانه برگردان.</li><li>یک خط کوتاه تمرین کن و فقط دقت را بسنج.</li></ol><p class=\"tech\"><span class=\"tnum\">ردیف پایه و پیدا کردن خانه بدون نگاه</span></p><p>ردیف پایه نقطه‌ی برگشت انگشت‌هاست، اما محل دقیق حرف‌ها به زبان و چیدمان وابسته است. در صفحه‌کلیدهای انگلیسی رایج معمولاً برجستگی کوچکی روی دو کلید راهنمای دست راست وجود دارد؛ با لمس آن‌ها می‌توان جای دست را پیدا کرد. در بعضی صفحه‌کلیدها این نشانه‌ها کم‌رنگ‌اند یا وجود ندارند، پس می‌توانی با نگاه اولیه جای خود را پیدا کنی و سپس دست را آرام روی ردیف پایه قرار بدهی. پس از زدن هر کلید، انگشت را با حرکت کوتاه به جای شروع برگردان؛ این کار کمک می‌کند حرکت‌های بعدی از نقطه‌ای آشنا آغاز شوند. تمرین را با چند حرف و کلمه‌ی کوتاه شروع کن. اگر دست‌هایت مرتب از جای اصلی دور می‌شوند، سرعت را کمتر کن و هر بار پیش از ادامه موقعیت را بازیابی کن. هدف کورکورانه تایپ‌کردن نیست؛ هدف ساختن حس مکانی قابل‌اعتماد است.</p><p class=\"tech\"><span class=\"tnum\">چیدمان دستگاه را به خاطر بسپار، نه فقط تصویر را</span></p><p>نقشه‌های آموزشی معمولاً یک نوع صفحه‌کلید را نشان می‌دهند، اما دستگاه تو ممکن است چیدمان متفاوتی داشته باشد. پیش از شروع، زبان ورودی و آرایش حروف را بررسی کن. در صفحه‌کلید انگلیسی رایج، برجستگی روی بعضی کلیدها کمک می‌کند ردیف پایه را لمس کنی؛ در بعضی مدل‌ها این برجستگی کم‌رنگ است. می‌توانی ابتدا جای دست را نگاه کنی و پس از قرارگیری درست، تمرین بدون نگاه را آغاز کنی. اگر مکرراً جای دست را گم می‌کنی، پیش از هر دور انگشت‌ها را به خانه برگردان و دوباره شروع کن. برای تایپ فارسی لازم نیست فرض کنی برچسب‌های ظاهری دقیقاً با جای حروف در همه‌ی سیستم‌ها سازگارند؛ جای واقعی کلیدها را در زبان ورودی فعال خودت بشناس. یک نقشه‌ی کوچک کنار نمایشگر در روزهای نخست اشکالی ندارد؛ به مرور تلاش کن کمتر به آن وابسته شوی.</p>"},{"h":"ردیف بالا و رسیدن کنترل‌شده به کلیدها","b":"<p>پس از آنکه ردیف پایه برایت آشنا شد، کلیدهای ردیف بالا را با حرکت انگشت مربوط تمرین کن. انگشت لازم است کمی بالا برود و پس از فشردن کلید، به خانه برگردد؛ تمام دست را جلو نبر. حرکت کوتاه‌تر باعث می‌شود کمتر گم شوی و فشار اضافه به مچ وارد نکنی. در آغاز فقط دو یا سه کلید را اضافه کن و آن‌ها را با کلیدهای ردیف پایه ترکیب کن، به جای اینکه یک‌باره تمام صفحه‌کلید را تمرین کنی.</p><p>هنگام تایپ کلمه، دنبال الگوی حرکت باش نه اینکه کل کلمه را با یک حرکت دست بزنی. برای مثال، در کلمه‌ای که دو حرف پیاپی به انگشت‌های متفاوت مربوط‌اند، حرکت باید نرم و پیوسته باشد. اگر یک انگشت برای رسیدن به کلید خیلی کشیده می‌شود، بررسی کن آیا جای دست را درست پیدا کرده‌ای یا چیدمان صفحه‌کلید متفاوت است.</p><p>تمرین روی کلمات معنی‌دار کمک می‌کند مسیر انگشت‌ها را در متن واقعی ببینی. اما اگر هنوز جای یک کلید را نمی‌دانی، چند ترکیب ساده و تکراری هم مفید است. مهم این است که هر تمرین هدف مشخص داشته باشد: شناخت جای کلید، ترکیب حرکت‌ها یا افزایش روانی.</p><p class=\"tech\"><span class=\"tnum\">تمرین</span> از آسان به دشوار</p><p>ابتدا چند بار کلیدهای تازه را تنها تمرین کن، سپس ترکیب‌های دوحرفی و در پایان کلمه‌های کوتاه بساز. اگر دقت پایین آمد، به مرحله‌ی قبلی برگرد. پیشرفت زمانی پایدار است که بتوانی حرکت را بدون نگاه و با فشار کم انجام دهی.</p><p class=\"tech\"><span class=\"tnum\">رسیدن به ردیف بالا بدون کشیدن دست</span></p><p>وقتی به کلیدهای ردیف بالا می‌رسی، تا حد امکان همان انگشت مسئول را حرکت بده و پس از ضربه به نقطه‌ی پایه برگرد. لازم نیست انگشت را بیش از اندازه بکشانی یا کل دست را ناگهان جابه‌جا کنی. بعضی کلمه‌ها چند کلید پشت سر هم از ردیف‌های مختلف دارند؛ آن‌ها را آرام تایپ کن و به این توجه کن که کدام انگشت حرکت می‌کند و بعد کجا فرود می‌آید. اگر با یک ترکیب مرتب اشتباه می‌کنی، آن را به دو بخش کوتاه‌تر تقسیم کن و فقط همان بخش را تمرین کن. چیدمان زبان فارسی و انگلیسی را جداگانه در نظر بگیر؛ اگر میان دو زبان جابه‌جا می‌شوی، پیش از شروع متن زبان ورودی را کنترل کن تا تصور نکنی انگشت اشتباه کرده است. بعد از چند دور، یک جمله‌ی واقعی تایپ کن تا حرکت‌ها فقط در تمرین‌های جداگانه باقی نمانند.</p><p class=\"tech\"><span class=\"tnum\">تمرین از کلید به ترکیب، نه پرش ناگهانی</span></p><p>وقتی کلیدی تازه به تمرین اضافه می‌کنی، ابتدا همان کلید را تنها پیدا کن، سپس آن را با یک کلید آشنا ترکیب کن و در پایان در یک کلمه‌ی کوتاه به کار ببر. این ترتیب کمک می‌کند بفهمی خطا از جای کلید است یا از هماهنگی چند انگشت. اگر انگشت مسئول کلید دوری است، دست را با کشش افراطی نگه ندار؛ حرکت باید طبیعی باشد و پس از ضربه به موقعیت آماده برگردد. در ترکیب‌های سریع، بعضی انگشت‌ها ممکن است حرکت هم‌زمان داشته باشند؛ عجله نکن که حرکت‌ها زودتر از توان کنترل تو انجام شوند. اگر لازم است، همان ترکیب را آهسته و با ریتم ثابت تکرار کن. پس از آن یک جمله‌ی کوتاه بنویس تا حس کنی تمرین چطور به نوشتن واقعی منتقل می‌شود.</p>"},{"h":"ردیف پایین و کلیدهای دورتر","b":"<p>ردیف پایین ممکن است در ابتدا دشوارتر باشد، چون انگشت‌ها به سمت پایین حرکت می‌کنند و اگر مچ همراه آن خم شود، بدن زودتر خسته می‌شود. حرکت باید از انگشت انجام شود و مچ تقریباً راحت بماند. ابتدا هر کلید را جدا تمرین کن، سپس آن را با ردیف پایه ترکیب کن. هر بار پس از ضربه به وضعیت خانه برگرد؛ این عادت کمک می‌کند موقعیت دست گم نشود.</p><p>برای کلیدهای دورتر، مجبور نیستی همه‌ی دست را بلند کنی. کمی حرکت طبیعی انگشت و در صورت نیاز جابه‌جایی کوچک ساعد کافی است؛ اصل این است که حرکت بی‌دلیل بزرگ نشود و مچ در حالت ناراحت نماند. در بعضی صفحه‌کلیدهای کوچک یا لپ‌تاپ‌ها، فاصله‌ی کلیدها متفاوت است، پس چند جلسه زمان بده تا به همان وسیله عادت کنی.</p><p>کلیدهای دورتر را در کلمه‌ها و جمله‌های واقعی هم تمرین کن. اگر فقط رشته‌های بی‌معنا تایپ کنی، ممکن است در جابه‌جایی بین کلیدها بهتر شوی اما ریتم نوشتن متن همچنان سخت بماند. تمرین متنوع، انتقال مهارت به کار روزمره را بهتر می‌کند.</p><p class=\"tech\"><span class=\"tnum\">تمرین ترکیبی</span></p><p>یک خط کوتاه با حروف هر سه ردیف تایپ کن. پس از خط، سه اشتباه پرتکرار را علامت بزن و فقط همان ترکیب‌ها را به آرامی تکرار کن. اگر درد یا گزگز پیش آمد، تمرین را ادامه نده و وضعیت دست را اصلاح کن.</p><p class=\"tech\"><span class=\"tnum\">کلیدهای پایین و کلیدهای اصلاح</span></p><p>ردیف پایین را با حرکت انگشت تمرین کن و مچ را برای هر ضربه خم نکن. اگر به کلید دورتر نیاز داری، حرکت طبیعی ساعد هم می‌تواند کمک کند؛ مهم این است که کشش افراطی و دردناک ایجاد نشود. کلیدهای اصلاح مثل Backspace و Delete هم بخشی از تایپ واقعی‌اند، اما استفاده‌ی پی‌درپی و عجولانه از آن‌ها ممکن است ریتم را به‌هم بزند. هنگام تمرین، اگر اشتباه کردی، یک لحظه توقف کن و علت را بشناس: آیا جای کلید را اشتباه به خاطر سپرده‌ای یا انگشت پیش از برگشت کامل حرکت بعدی را آغاز کرده است؟ بعد همان الگو را آهسته تکرار کن. در نوشتن نهایی، اصلاح متن طبیعی است و نباید برای حفظ رکورد از بازبینی صرف‌نظر کنی. سرعت باید به دقت و خوانایی کمک کند، نه اینکه آن‌ها را قربانی کند.</p><p class=\"tech\"><span class=\"tnum\">میان‌بُرها را بعد از تسلط پایه اضافه کن</span></p><p>کلیدهای کمکی مثل Shift، Ctrl یا Alt و میان‌برهای کپی، چسباندن و بازگشت می‌توانند در کار روزانه سرعت ایجاد کنند، اما ترتیب یادگیری اهمیت دارد. ابتدا باید بتوانی کلیدهای اصلی را دقیق پیدا کنی؛ بعد چند میان‌بُر پرکاربرد را برای دستگاه و برنامه‌ی خودت یاد بگیر. ترکیب کلیدها در سیستم‌عامل‌ها و برنامه‌ها یکسان نیست و بعضی میان‌بُرها با چیدمان زبان فرق می‌کنند. اگر دستت برای نگه‌داشتن چند کلید هم‌زمان کشیده می‌شود، از روشی استفاده کن که فشار کمتری ایجاد کند یا میان‌بُر را بعداً تمرین کن. در متن نهایی، هدف این است که کار را درست انجام بدهی؛ استفاده از میان‌بُر فقط وقتی مفید است که باعث خطا یا ناراحتی نشود.</p>"},{"h":"اعداد، نشانه‌ها و نیم‌فاصله‌ی فارسی","b":"<p>بعد از حروف، نوبت اعداد و نشانه‌های نگارشی است. در کار واقعی به ندرت فقط حروف تایپ می‌کنی؛ نام درس، تاریخ، شماره، پرانتز و علامت سؤال هم وجود دارند. نشانه‌ها را از روی چیدمان فعلی خودت یاد بگیر، چون جای آن‌ها در زبان‌ها یا صفحه‌کلیدهای مختلف ممکن است تغییر کند. لازم نیست در یک جلسه همه‌ی نشانه‌ها را حفظ کنی؛ هر روز چند مورد پرکاربرد را به تمرین اضافه کن.</p><p>در تایپ فارسی، نیم‌فاصله برای شکل درست بسیاری از ترکیب‌ها مهم است؛ مانند «می‌روم»، «کتاب‌ها» و «دانش‌آموز». محل و روش درج نیم‌فاصله به سیستم‌عامل و چیدمان صفحه‌کلید بستگی دارد، پس آن را در دستگاه خودت پیدا کن و در چند واژه‌ی پرتکرار تمرین کن. نیم‌فاصله با فاصله‌ی کامل فرق دارد: فاصله‌ی کامل دو واژه را جدا می‌کند، اما نیم‌فاصله پیوند نوشتاری را حفظ می‌کند.</p><p>هنگام استفاده از Shift یا کلیدهای ترکیبی، دست را در وضعیتی راحت نگه دار و برای هر نشانه به صفحه‌کلید نگاه نکن. در تمرین فارسی، «ی» و «ک» و علائم ممکن است در متون کپی‌شده شکل‌های متفاوت داشته باشند؛ برای متن نهایی، یکنواختی نویسه‌ها را هم بررسی کن. تایپ سریع نباید باعث شود متن فارسی از نظر نگارشی نامرتب شود.</p><p class=\"tech\"><span class=\"tnum\">تمرین کاربردی</span></p><p>یک پاراگراف فارسی بنویس که در آن تاریخ، دو عدد، پرانتز، ویرگول، علامت سؤال و چند نیم‌فاصله وجود داشته باشد. پس از تایپ، فقط نشانه‌گذاری را بازبینی کن. این تمرین مهارت را به متن واقعی وصل می‌کند.</p><p class=\"tech\"><span class=\"tnum\">نیم‌فاصله، علائم و تغییر زبان</span></p><p>در فارسی، فاصله‌ی کامل و نیم‌فاصله کار یکسانی ندارند. در «کتاب‌ها» نیم‌فاصله اتصال نوشتاری را حفظ می‌کند، اما دو واژه‌ی مستقل معمولاً با فاصله‌ی کامل جدا می‌شوند. راه واردکردن نیم‌فاصله به سیستم‌عامل، نسخه‌ی صفحه‌کلید و تنظیمات زبان بستگی دارد؛ به همین خاطر، روش درج را روی دستگاه خودت بررسی کن و با چند واژه‌ی پرتکرار تمرین کن، نه اینکه ترکیب کلید یک دستگاه دیگر را قطعی فرض کنی. علائم نگارشی، پرانتز، عدد و Shift را به‌تدریج به تمرین اضافه کن. اگر متنی فارسی را از منبع دیگری کپی می‌کنی، ممکن است حروف «ی» و «ک» یا شکل فاصله‌ها یکدست نباشند؛ در بازبینی نهایی، هم محتوا و هم یکدستی نوشتار را بررسی کن. برای نوشتن سریع، متن کوتاهی بساز که عدد، تاریخ، علامت سؤال و چند نیم‌فاصله داشته باشد و بعد فقط همین موارد را بازبینی کن.</p><p class=\"tech\"><span class=\"tnum\">بازبینی نشانه‌گذاری را جدا از تایپ تمرین کن</span></p><p>بعد از نوشتن یک پاراگراف، بار اول فقط معنی و ترتیب جمله‌ها را بررسی کن؛ بار دوم روی املا، نیم‌فاصله و علائم نگارشی تمرکز کن. این دو مرحله را جدا کردن کمک می‌کند هنگام تایپ اولیه، هر اشتباه کوچک باعث قطع فکر نشود و در عین حال خطاهای متن نهایی نادیده نمانند. اگر برنامه‌ی واژه‌پرداز پیشنهاد اصلاح می‌دهد، هر پیشنهاد را کورکورانه نپذیر؛ بعضی نام‌ها، اصطلاح‌های درسی یا صورت‌های فارسی ممکن است به‌درستی شناخته نشوند. روش درج نیم‌فاصله را بر اساس سیستم خودت بیاموز و برای ترکیب‌های پرکاربرد تمرین کن. بعد از پایان، چند نمونه را با چشم بررسی کن تا مطمئن شوی فاصله‌ها و حروف یکسان‌اند. تایپ سریع زمانی مفید است که خروجی هم قابل‌خواندن و درست باشد.</p>"},{"h":"دقت، ریتم و اصلاح اشتباه","b":"<p>تایپ روان شبیه موسیقی است: حرکت‌ها باید منظم باشند، نه اینکه هر چند کلمه سرعت ناگهان بالا و پایین برود. در شروع، آهسته تایپ کن و سعی کن هر ضربه درست باشد. بعد از مدتی سرعت به‌طور طبیعی بهتر می‌شود، چون جای کلیدها کمتر نیاز به فکر آگاهانه دارد. اگر به محض دیدن سرعت پایین، دست را تند کنی، خطا بیشتر می‌شود و مغز مسیر اشتباه را تمرین می‌کند.</p><p>دقت را می‌توان با درصد کلیدهای درست یا تعداد اشتباه‌ها سنجید. هنگام آزمون، نوع متن و مدت را ثبت کن تا مقایسه منصفانه باشد. یک بار متن ساده و بار دیگر متن پر از علامت یا واژه‌ی ناآشنا، آزمون یکسانی نیست. هدف خوب در تمرین روزانه می‌تواند ابتدا دقت بالا و سپس سرعت بیشتر باشد؛ وقتی دقت هنوز ناپایدار است، سرعت را اولویت اول نکن.</p><p>اصلاح اشتباه هم بخشی از مهارت است. بعضی برنامه‌ها امکان نمایش خطا را دارند؛ اگر از آن‌ها استفاده می‌کنی، بعد از هر دور خطاها را بررسی کن و الگوهای پرتکرار را پیدا کن. مثلاً اگر همیشه دو کلید همسایه را اشتباه می‌زنی، تمرین کوتاه همان جفت کلید مؤثرتر از تکرار دوباره‌ی تمام متن است.</p><p class=\"tech\"><span class=\"tnum\">قاعده‌ی تمرین</span></p><p>تا زمانی که در یک متن کوتاه دقتت پایین می‌آید، سرعت را بالا نبر. وقتی حرکت‌ها درست و راحت شدند، سرعت را اندک‌اندک زیاد کن؛ اگر خطاها زیاد شد دوباره یک پله آهسته‌تر شو.</p><p class=\"tech\"><span class=\"tnum\">روش درست بررسی خطا</span></p><p>وقتی اشتباه رخ می‌دهد، فقط به تعداد خطاها نگاه نکن؛ ببین خطاها از چه نوعی هستند. شاید جای کلید را فراموش می‌کنی، شاید دو انگشت را جابه‌جا می‌گیری، یا شاید آن‌قدر سریع می‌روی که حرکت‌ها کامل نمی‌شوند. پس از یک آزمون کوتاه، سه خطای پرتکرار را یادداشت کن و برای هرکدام یک تمرین کوچک انتخاب کن. اگر کلید مشخصی مشکل دارد، همان را در چند کلمه تمرین کن؛ اگر خطا هنگام تغییر زبان پیش می‌آید، روی کنترل زبان ورودی تمرکز کن. در پایان دوباره متن مشابه را تایپ کن و ببین خطا کمتر شده یا نه. هر جلسه همه‌چیز را تغییر نده؛ اگر هم‌زمان سرعت، وضعیت دست و نوع متن را عوض کنی، فهمیدن علت پیشرفت سخت می‌شود. دقت پایدار معمولاً پایه‌ی قابل‌اعتمادتری برای افزایش سرعت است.</p><p class=\"tech\"><span class=\"tnum\">از اشتباه، تمرین بساز</span></p><p>اشتباه پرتکرار را به فهرست بلند و ترسناک تبدیل نکن؛ فقط دو یا سه الگو را برای جلسه‌ی بعد انتخاب کن. مثلاً اگر در یک ترکیب انگشت‌ها زود به حرکت بعدی می‌روند، همان ترکیب را آرام تکرار کن. اگر به کلید درست می‌رسی ولی حرف دیگری ثبت می‌شود، زبان ورودی و تنظیمات صفحه‌کلید را بررسی کن. اگر اشتباه‌ها بعد از چند دقیقه زیاد می‌شوند، احتمال دارد خسته شده باشی؛ جلسه را کوتاه کن یا وقفه بده. پس از تمرین اصلاحی، دوباره یک متن هم‌سطح تایپ کن. اگر همان خطا کمتر شد، تمرین هدفمند اثر داشته است. اگر تغییری نکرد، روش را عوض کن یا از آموزش دیگری برای همان حرکت استفاده کن. ثبت علت خطا از تکرار کورکورانه‌ی متن مؤثرتر است.</p>"},{"h":"از تمرین جداگانه تا نوشتن متن واقعی","b":"<p>تمرین‌های ردیف‌ها برای ساختن حافظه‌ی حرکتی لازم‌اند، اما اگر فقط آن‌ها را تکرار کنی ممکن است در نوشتن واقعی هنوز کند باشی. مرحله‌ی بعد، تایپ کلمه‌ها، جمله‌ها و متن‌هایی است که واقعاً به آن‌ها نیاز داری؛ مثل خلاصه‌ی یک درس یا پیام کوتاه. این انتقال نشان می‌دهد انگشت‌ها فقط یک الگو را حفظ نکرده‌اند، بلکه در کاربرد واقعی هم همراه فکر حرکت می‌کنند.</p><p>متن تمرین را از سطح مناسب انتخاب کن. اگر تمام واژه‌ها ناشناس باشند، ذهن بیشتر درگیر املا و معنی می‌شود تا جای کلید. ابتدا متن ساده و آشنا، سپس ترکیب‌های متنوع و در نهایت متن واقعی درس را استفاده کن. برای زبان فارسی، جمله‌هایی را انتخاب کن که نیم‌فاصله و نشانه‌گذاری معمول داشته باشند؛ برای انگلیسی هم حروف بزرگ و علائم را به‌تدریج اضافه کن.</p><p>هنگام تایپ تکلیف، وسوسه نشو که هر بار به صفحه‌کلید نگاه کنی. اگر جای یک کلید را فراموش کردی، تلاش کن از نشانه‌های روی ردیف پایه راهت را پیدا کنی؛ اگر چند بار اشتباه شد، تمرین هدفمند همان کلید را جدا انجام بده و دوباره به متن برگرد. نگاه‌نکردن به صفحه‌کلید در آغاز دشوار است اما با تمرین کوتاه و درست آسان‌تر می‌شود.</p><p class=\"tech\"><span class=\"tnum\">تمرین واقعی</span></p><p>یک خلاصه‌ی ۱۰۰ واژه‌ای از درس امروز تایپ کن. بعد سرعت، تعداد اشتباه‌ها و میزان خستگی را یادداشت کن. هدف این است که تایپ برای کار واقعی قابل‌استفاده شود، نه فقط برای تست‌های سرعت.</p><p class=\"tech\"><span class=\"tnum\">تمرین را به نوشتن واقعی وصل کن</span></p><p>پس از تمرین کلیدها، یک کار کوتاه واقعی انجام بده: خلاصه‌ی درس، پیام رسمی یا چند جمله درباره‌ی روزت. چون هنگام نوشتن واقعی باید هم‌زمان فکر کنی، املا را به یاد بیاوری و جمله بسازی، سرعتت ممکن است از سرعت تست پایین‌تر باشد؛ این طبیعی است. برای مقایسه‌ی منصفانه، هم تست تمرینی و هم یک نمونه‌ی نوشتن واقعی را ثبت کن. اگر متن را رونویسی می‌کنی، چشم باید بین منبع و صفحه‌کلید جابه‌جا شود؛ متن کوتاه انتخاب کن تا لازم نباشد هر چند کلمه دوباره دنبال خط بگردی. بعد از تایپ، محتوا را بازخوانی کن و خطاهای نگارشی را اصلاح کن. هدف نهایی این است که تایپ، وسیله‌ی بیان اندیشه باشد؛ اگر سرعت بالا رفته اما جمله‌ها پر از خطا شده‌اند، تمرین هنوز باید روی دقت و بازبینی کار کند.</p><p class=\"tech\"><span class=\"tnum\">تفاوت رونویسی و نوشتن از ذهن</span></p><p>در رونویسی، کلمات را از منبع می‌بینی و تایپ می‌کنی؛ در نوشتن از ذهن، هم‌زمان جمله را هم می‌سازی. بنابراین این دو تمرین مهارت‌های یکسانی را نمی‌سنجند. برای بهبود جای کلیدها، رونویسی کوتاه مناسب است؛ برای استفاده‌ی واقعی، خلاصه‌کردن درس یا نوشتن چند جمله از ذهن را هم اضافه کن. هنگام رونویسی، خط‌های کوتاه انتخاب کن تا برای پیدا کردن محل ادامه مجبور نباشی مرتب بالا و پایین بروی. هنگام نوشتن آزاد، نگذار نگرانی از سرعت باعث شود فکر را بیش از حد ساده کنی یا از بازبینی دست بکشی. بعد از تمرین، یک جمله درباره‌ی آنچه آموختی بنویس و متن را بازخوانی کن. هدف این است که تایپ، مانع بیان ایده‌ها نباشد و هم‌زمان دقت نوشتار حفظ شود.</p>"},{"h":"اندازه‌گیری پیشرفت و حل مشکلات","b":"<p>سرعت تایپ معمولاً با تعداد واژه در دقیقه یا تعداد کاراکتر در دقیقه گزارش می‌شود، اما برنامه‌ها ممکن است روش محاسبه‌ی متفاوتی داشته باشند؛ بنابراین بهتر است از یک ابزار ثابت و متن‌های هم‌سطح استفاده کنی. دقت را هم کنار سرعت ثبت کن. اگر سرعت از ۲۰ به ۲۵ واژه در دقیقه می‌رود اما اشتباه‌ها دو برابر می‌شوند، نتیجه لزوماً بهتر نیست. برای کار مدرسه، تایپ دقیق و اصلاح کم گاهی از رکورد سریع اما پرخطا مفیدتر است.</p><p>اگر در یک مرحله گیر کرده‌ای، مشکل را تفکیک کن: آیا جای کلید را فراموش می‌کنی؟ انگشت اشتباه حرکت می‌کند؟ مچ خسته می‌شود؟ متن دشوار است؟ یا مدت تمرین بیش از توان فعلی است؟ برای هر علت راه‌حل فرق دارد. تمرین جای کلید برای خطای حرکتی، تغییر متن برای دشواری واژگان، و استراحت و اصلاح حالت بدن برای خستگی مناسب‌تر است.</p><p>هر هفته یک نمونه‌ی ثابت را دوباره تایپ کن و نتیجه را با هفته‌ی قبل مقایسه کن. از یک تست منفرد نتیجه‌ی قطعی نگیر؛ خواب، خستگی و دشواری متن روی عملکرد اثر می‌گذارند. اگر چند جلسه پیاپی درد داری یا مچ و انگشت‌ها بی‌حس می‌شوند، تمرین را متوقف کن و وضعیت ارگونومی را بررسی کن؛ این علائم را به عنوان بهای طبیعی یادگیری نادیده نگیر.</p><p class=\"tech\"><span class=\"tnum\">فرم ثبت</span></p><p>تاریخ، نوع متن، مدت، سرعت، دقت، یک خطای پرتکرار و یک هدف جلسه‌ی بعد را بنویس. این ثبت کوتاه نشان می‌دهد کجا واقعاً پیشرفت کرده‌ای و کجا باید روش را تغییر بدهی.</p><p class=\"tech\"><span class=\"tnum\">جدول ساده‌ی ثبت پیشرفت</span></p><p>برای اینکه نتیجه قابل‌اندازه‌گیری باشد، در هر جلسه تاریخ، مدت تمرین، نوع متن، سرعت تقریبی، میزان دقت و یک خطای پرتکرار را ثبت کن. اگر برنامه‌ی تایپ تعداد واژه در دقیقه و درصد دقت را نشان می‌دهد، مطمئن شو در همه‌ی آزمون‌ها از همان ابزار و مدت مشابه استفاده می‌کنی. تست پنجاه‌ثانیه‌ای را با متن دشوار و تست سه‌دقیقه‌ای را با متن بسیار ساده مستقیم مقایسه نکن. یک یا دو بار نتیجه‌ی خوب یا بد ممکن است به خستگی، آشنا بودن متن یا حواس‌پرتی مربوط باشد؛ روند چند جلسه اطلاعات بهتری می‌دهد. اگر سرعت ثابت مانده اما خطا کمتر شده، این هم پیشرفت است. اگر هم درد یا بی‌حسی ایجاد می‌شود، عددهای سرعت را کنار بگذار و اول شرایط بدنی را اصلاح کن. دفتر ثبت باید کمک کند تصمیم بگیری چه چیزی را تمرین کنی، نه اینکه باعث اضطراب و رقابت بی‌فایده شود.</p><p class=\"tech\"><span class=\"tnum\">سرعت، دقت و راحتی را با هم بسنج</span></p><p>سرعت تایپ معمولاً با واژه در دقیقه یا کاراکتر در دقیقه نمایش داده می‌شود؛ شیوه‌ی محاسبه در ابزارهای مختلف ممکن است فرق کند. از یک ابزار و متن‌های هم‌سطح استفاده کن تا مقایسه معنی داشته باشد. علاوه بر عدد سرعت، درصد دقت، نوع خطا و حس راحتی دست را هم ثبت کن. مثلاً اگر سرعت از ۲۰ به ۲۴ واژه در دقیقه می‌رسد، اما خطاها و خستگی بیشتر می‌شوند، باید تمرین را به دقت و وضعیت بدن برگردانی. اگر سرعت ثابت است ولی خطا کمتر شده، این هم نشانه‌ی رشد است؛ لازم نیست هر جلسه رکوردشکنی کنی. آزمون را در زمانی انجام بده که بتوانی با تمرکز کار کنی و نتیجه‌ی یک روز پراسترس را معیار قطعی قرار نده. بررسی روند چند جلسه تصویر منصفانه‌تری می‌دهد.</p>"},{"h":"برنامه‌ی سی‌روزه، واژه‌نامه و آزمون","b":"<p>در هفته‌ی اول، وضعیت بدن و ردیف پایه را تمرین کن؛ جلسه‌ها کوتاه باشند تا جای انگشت‌ها جا بیفتد. هفته‌ی دوم، ردیف بالا و پایین را آرام اضافه کن. هفته‌ی سوم، اعداد، نشانه‌ها، نیم‌فاصله و جمله‌های واقعی را وارد تمرین کن. هفته‌ی چهارم، یک متن کوتاه در شرایط مشابه تایپ کن و سرعت و دقت را با خط پایه مقایسه کن. اگر یک مرحله هنوز ناپایدار است، لازم نیست صرفاً به خاطر تقویم به مرحله‌ی بعد بروی؛ برنامه باید با پیشرفت واقعی تنظیم شود.</p><p>هر روز تمرین کوتاه بهتر از یک جلسه‌ی طولانی و خسته‌کننده است. میان کارها استراحت کن و اگر دست‌ها درد دارند، آن روز ادامه نده. تمرین را با فشار زیاد به مسابقه تبدیل نکن؛ هدف ساختن عادت حرکتی سالم و قابل‌استفاده است.</p><p><b>واژه‌نامه:</b> «ردیف پایه» جای استراحت و بازگشت انگشت‌ها؛ «حافظه‌ی حرکتی» توانایی انجام الگوی حرکت با تمرین؛ «دقت تایپ» سهم ضربه‌های درست؛ «نیم‌فاصله» فاصله‌ی کنترلی برای پیوند نوشتاری در فارسی؛ «ارگونومی» تنظیم ابزار و وضعیت بدن برای کار راحت‌تر و ایمن‌تر.</p><p class=\"tech\"><span class=\"tnum\">آزمون پایانی</span></p><details><summary>۱) چرا در آغاز باید دقت را بر سرعت مقدم دانست؟</summary><p>چون تکرار خطا می‌تواند الگوی حرکتی اشتباه را تثبیت کند و اصلاح بعدی را سخت‌تر سازد.</p></details><details><summary>۲) آیا باید همیشه به صفحه‌کلید نگاه نکرد؟</summary><p>هدف، کم‌کردن وابستگی به نگاه است؛ اگر خطای مکرر داری، تمرین هدفمند جای کلید را انجام بده و سپس به متن برگرد.</p></details><details><summary>۳) اگر مچ دست درد گرفت چه کنیم؟</summary><p>تمرین را متوقف کن، وضعیت بدن و ابزار را بررسی کن و اگر درد ادامه یافت از متخصص مناسب کمک بگیر.</p></details><p>پس از پایان ماه، آزمون سرعت را با یک متن هم‌سطح تکرار کن و میزان فهم و خستگی را هم در نظر بگیر. پیشرفت زمانی معنا دارد که تایپ دقیق‌تر، راحت‌تر و برای کارهای واقعی مفیدتر شده باشد.</p><p class=\"tech\"><span class=\"tnum\">برنامه‌ی چهار هفته‌ای و آزمون پایانی</span></p><p>هفته‌ی اول، جای دست و ردیف پایه را در جلسه‌های کوتاه تمرین کن؛ هفته‌ی دوم، کلیدهای ردیف بالا و پایین را اضافه کن؛ هفته‌ی سوم، نشانه‌ها، اعداد، نیم‌فاصله و تغییر زبان را به متن وارد کن؛ هفته‌ی چهارم، چند متن واقعی تایپ کن و نتیجه را با خط پایه مقایسه کن. اگر یک مرحله هنوز با خطای زیاد انجام می‌شود، همان مرحله را ادامه بده؛ برنامه‌ی تقویمی از یادگیری واقعی مهم‌تر نیست. واژه‌نامه: «ردیف پایه» محل شروع و بازگشت انگشت‌ها؛ «حافظه‌ی حرکتی» یادگیری الگوی حرکت با تمرین؛ «دقت» نسبت ضربه‌ها یا واژه‌های درست به کل آزمون؛ «ارگونومی» تنظیم ابزار و وضعیت بدن برای کار راحت‌تر. برای آزمون پایانی یک متن ۱۰۰ تا ۱۵۰ واژه‌ای انتخاب کن، آن را با زمان مشخص تایپ کن و بعد از نظر سرعت، خطا، خوانایی و خستگی بررسی کن. نتیجه را با آزمون اول مقایسه کن. اگر دقیق‌تر و راحت‌تر می‌نویسی، حتی با افزایش کم سرعت، تمرین نتیجه داده است.</p><p class=\"tech\"><span class=\"tnum\">چک‌لیست پایان ماه</span></p><p>در پایان چهار هفته به این پرسش‌ها پاسخ بده: آیا می‌توانم دست را بدون نگاه روی جای شروع قرار بدهم؟ آیا در متن ساده کمتر به صفحه‌کلید نگاه می‌کنم؟ آیا سرعت را با دقت قابل‌قبول حفظ می‌کنم؟ آیا پس از تمرین درد یا خستگی غیرعادی دارم؟ اگر یکی از مهارت‌ها هنوز ناپایدار است، همان را هدف هفته‌ی بعد بگذار. واژه‌نامه: «ردیف پایه» محل آماده‌باش انگشت‌ها؛ «حافظه‌ی حرکتی» تثبیت تدریجی حرکت با تکرار درست؛ «دقت» سهم ضربه‌ها یا واژه‌های صحیح؛ «نیم‌فاصله» نشانه‌ی پیوند نوشتاری در بخشی از ترکیب‌های فارسی؛ «ارگونومی» تنظیم محل کار و ابزار برای کاهش فشار. برای آزمون نهایی یک متن کوتاه و هم‌سطح با آزمون نخست انتخاب کن. سرعت، خطا، خوانایی و راحتی را مقایسه کن. اگر دقیق‌تر و راحت‌تر تایپ می‌کنی، حتی بدون جهش بزرگ در سرعت هم پیشرفت کرده‌ای.</p>"}];

const store={get(k,d){try{const v=localStorage.getItem(KEY+'_'+k);return v===null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+'_'+k,v);}catch(e){}}};
const FA_D='۰۱۲۳۴۵۶۷۸۹';
const faT=s=>{s=Math.max(0,Math.floor(s||0));const m=Math.floor(s/60),r=s%60;const f=n=>String(n).replace(/[0-9]/g,d=>FA_D[d]);return f(m)+':'+String(r).padStart(2,'0').replace(/[0-9]/g,d=>FA_D[d]);};
const SVG_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg>';
const SVG_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="#fff"/></svg>';
const SVG_VOL='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="#fff"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const SVG_MUTE='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="#fff"/><path d="M16 9l6 6M22 9l-6 6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const audios=AUDIO.map((src,i)=>{
  const a=new Audio();a.preload='metadata';a.src=src;
  a.volume=parseFloat(store.get('vol','1'));if(isNaN(a.volume))a.volume=1;
  a.muted=store.get('mut','0')==='1';
  const sv=(store.get('last','')||'').split('|');const saved=(+sv[0]===i&&open===i)?(parseFloat(sv[1])||0):0;let lastSave=0;
  a.addEventListener('loadedmetadata',()=>{if(saved>1&&a.duration&&saved<a.duration-5){try{a.currentTime=saved;}catch(e){}}syncUI(i);});
  a.addEventListener('timeupdate',()=>{syncUI(i);const n=Date.now();if(n-lastSave>4000){lastSave=n;store.set('last',i+'|'+a.currentTime.toFixed(1));}});
  a.addEventListener('play',()=>{audios.forEach((o,j)=>{if(j!==i&&!o.paused)o.pause();});syncUI(i);});
  a.addEventListener('pause',()=>{store.set('last',i+'|'+a.currentTime.toFixed(1));syncUI(i);});
  a.addEventListener('ended',()=>{store.set('last',i+'|0');try{a.currentTime=0;}catch(e){}syncUI(i);});
  return a;
});
function syncUI(i){const box=document.querySelector('.ap[data-i="'+i+'"]');if(!box)return;const a=audios[i];box.classList.toggle('off',!(a.duration>0));box.querySelector('.pp').innerHTML=a.paused?SVG_PLAY:SVG_PAUSE;const d=a.duration||0,c=a.currentTime||0;box.querySelector('.fill').style.width=(d>0?(c/d*100):0)+'%';box.querySelector('.tm').textContent=faT(c)+' / '+faT(d);box.querySelector('.mu').innerHTML=(a.muted||a.volume===0)?SVG_MUTE:SVG_VOL;const v=box.querySelector('.vol');if(document.activeElement!==v)v.value=a.muted?0:a.volume;}
function apToggle(i){const a=audios[i];if(a.paused){a.play().catch(()=>{});}else{a.pause();}}
function apSeek(i,ev){const a=audios[i];if(!a.duration)return;const bar=ev.currentTarget,r=bar.getBoundingClientRect();let p=(ev.clientX-r.left)/r.width;if(getComputedStyle(bar).direction==='rtl')p=1-p;a.currentTime=Math.min(Math.max(p,0),1)*a.duration;syncUI(i);}
function apVol(i,v){v=parseFloat(v);audios.forEach(a=>{a.volume=v;if(v>0)a.muted=false;});store.set('vol',String(v));store.set('mut',v===0?'1':'0');audios.forEach((_,j)=>syncUI(j));}
function apMute(){const m=!audios[0].muted;audios.forEach(a=>{a.muted=m;});store.set('mut',m?'1':'0');audios.forEach((_,j)=>syncUI(j));}
function playerHTML(i){const vv=store.get('mut','0')==='1'?0:store.get('vol','1');return '<div class="ap off" data-i="'+i+'"><button class="pp" onclick="apToggle('+i+')" aria-label="پخش / مکث">'+SVG_PLAY+'</button><div class="bar" onclick="apSeek('+i+',event)"><div class="fill"></div></div><span class="tm">۰:۰۰ / ۰:۰۰</span><button class="mu" onclick="apMute()" aria-label="بی‌صدا">'+SVG_VOL+'</button><input class="vol" type="range" min="0" max="1" step="0.05" value="'+vv+'" oninput="apVol('+i+',this.value)" aria-label="بلندی صدا"></div>';}
function toggle(i){ open = (open===i) ? null : i; try{ open===null?localStorage.removeItem(KEY):localStorage.setItem(KEY,open) }catch(e){} render(); }
function render(){
  document.getElementById("app").innerHTML = SECTIONS.map((s,i)=>{
    const o = open===i;
    return `<section class="item${o?' open':''}">
      <div class="hd" onclick="toggle(${i})"><span class="num">${i+1}</span><span class="t">${s.h}</span><span class="chev">◂</span></div>
      <div class="body"><div class="inner">${playerHTML(i)}${s.b}</div></div>
    </section>`;
  }).join("");
}
render();
audios.forEach((_,j)=>syncUI(j));
</script>
<script>
(function(){var b=document.getElementById("theme");
function cur(){return document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}
function paint(){b.textContent=cur()==="dark"?"☀":"☾";}
b.onclick=function(){var n=cur()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("amz-theme",n);}catch(e){}paint();};paint();})();
</script>
</body>
</html>
