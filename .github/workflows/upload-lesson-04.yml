name: Upload lesson 04 to Parspack

on:
  push:
    branches:
      - arena/2de51f95-books-data
    paths:
      - 'Bucket/Html-files/آموزشگاه/**'
      - '.github/workflows/upload-lesson-04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-lesson-04:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PARSPACK_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      PARSPACK_ENDPOINT: https://c539776.parspack.net
      DESTINATION: s3://c539776/Bucket/Html-files/آموزشگاه
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Verify secrets are configured
        shell: bash
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo 'Required PARSPACK_ACCESS_KEY / PARSPACK_SECRET_KEY repository secrets are missing.' >&2
            exit 1
          fi

      - name: Upload lesson HTML and assets
        shell: bash
        run: |
          set -euo pipefail
          aws --version
          gzip -9 -n -c 'Bucket/Html-files/آموزشگاه/04-note-taking.html' > /tmp/04-note-taking.html.gz
          echo "Lossless gzip response size: $(stat -c %s /tmp/04-note-taking.html.gz) bytes"
          upload() {
            local config="$1" label="$2"
            shift 2
            local logfile=/tmp/parspack-upload.log status
            if [[ "$config" == "v4" ]]; then
              "$@" >"$logfile" 2>&1 || status=$?
            else
              AWS_CONFIG_FILE="$config" "$@" >"$logfile" 2>&1 || status=$?
            fi
            status=${status:-0}
            if [[ $status -ne 0 ]]; then
              echo "${label} upload failed (exit ${status}): $(tail -n 8 "$logfile" | tr '\n' ' ' | cut -c1-1000)" >&2
              return "$status"
            fi
            cat "$logfile"
          }

          upload_all() {
            local config="$1"
            upload "$config" HTML aws s3 cp \
              /tmp/04-note-taking.html.gz \
              "$DESTINATION/04-note-taking.html" \
              --endpoint-url "$PARSPACK_ENDPOINT" \
              --content-type 'text/html; charset=utf-8' \
              --content-encoding gzip \
              --cache-control 'no-cache, max-age=0, must-revalidate' \
              --no-progress || return $?

            upload "$config" Images aws s3 sync \
              'Bucket/Html-files/آموزشگاه/04-exam-pic/' \
              "$DESTINATION/04-exam-pic/" \
              --endpoint-url "$PARSPACK_ENDPOINT" \
              --cache-control 'public, max-age=31536000, immutable' \
              --no-progress || return $?

            upload "$config" Audio aws s3 sync \
              'Bucket/Html-files/آموزشگاه/04-exam-audio/' \
              "$DESTINATION/04-exam-audio/" \
              --endpoint-url "$PARSPACK_ENDPOINT" \
              --cache-control 'public, max-age=31536000, immutable' \
              --no-progress || return $?
          }

          used_config=v4
          if ! upload_all v4; then
            if grep -q 'SignatureDoesNotMatch' /tmp/parspack-upload.log; then
              echo 'Endpoint rejected SigV4; retrying once with S3 Signature V2.'
              cat >/tmp/aws-sigv2-config <<'EOF'
          [default]
          region = us-east-1
          signature_version = s3
          s3 =
              addressing_style = path
          EOF
              if ! upload_all /tmp/aws-sigv2-config; then
                details="$(tail -n 8 /tmp/parspack-upload.log | tr '\n' ' ' | cut -c1-1000)"
                echo "::error title=Parspack upload failed::Both supported signature attempts failed: ${details}"
                exit 1
              fi
              used_config=/tmp/aws-sigv2-config
            else
              details="$(tail -n 8 /tmp/parspack-upload.log | tr '\n' ' ' | cut -c1-1000)"
              echo "::error title=Parspack upload failed::${details}"
              exit 1
            fi
          fi

          upload "$used_config" Verify aws s3api head-object \
            --bucket c539776 \
            --key 'Bucket/Html-files/آموزشگاه/04-note-taking.html' \
            --endpoint-url "$PARSPACK_ENDPOINT" \
            --query '{ContentLength:ContentLength,ContentEncoding:ContentEncoding,ContentType:ContentType}' \
            --output json

# Retry after repository secret rotation.
