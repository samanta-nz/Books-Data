name: Fetch Persian TTS voices

on:
  push:
    paths:
      - "Bucket/Content/G09/g9-math/tools/fetch_voices.py"
      - ".github/workflows/fetch-tts-voices.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare and fetch voices
        continue-on-error: true
        env:
          LOG: Bucket/Content/G09/g9-math/tools/voices/job.log
        run: |
          mkdir -p Bucket/Content/G09/g9-math/tools/voices
          exec > >(tee -a "$LOG") 2>&1
          set -x
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.40" onnx onnxruntime onnxscript onnxconverter-common \
                      huggingface_hub "piper-tts>=1.8" numpy scipy num2words
          which ffmpeg || sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          cd Bucket/Content/G09/g9-math/tools
          python fetch_voices.py
          echo "[job] exit code: $?"

      - name: Commit voices and log
        if: always()
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -A Bucket/Content/G09/g9-math/tools/voices
          git commit -m "chore(voices): prepare Persian TTS voices [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
